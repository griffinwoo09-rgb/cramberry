<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cramberry: a free study app. Import vocab lists and learn them with flashcards, quizzes, and games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='8' width='22' height='17' rx='2' fill='white' stroke='%231A1E2A' stroke-width='2'/%3E%3Cpath d='M6 13h22' stroke='%23B0164A' stroke-width='2'/%3E%3Ccircle cx='21' cy='20' r='4.5' fill='%23B0164A'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cramberry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=Shantell+Sans:wght@500;700;800&display=swap">
<style>
/* Layout: one centered column under a sticky top bar; study modes get a focused stage built on the index-card motif. */
:root {
  --bg: #ECEFF5;
  --surface: #FFFFFF;
  --surface-2: #F4F6FA;
  --ink: #1A1E2A;
  --ink-soft: #586079;
  --line: #D5DAE5;
  --rule: #C9D9EF;
  --accent: #B0164A;
  --accent-hover: #93113D;
  --accent-ink: #FFFFFF;
  --accent-soft: #F8E2EA;
  --mark: #FFE15A;
  --mark-band: #FFE15A;
  --good: #1B7A4B;
  --good-soft: #DCF1E5;
  --bad: #BC3127;
  --bad-soft: #FADFDB;
  --learning: #C1820E;
  --gloss: rgba(255, 255, 255, .9);
  --shadow: 0 1px 2px rgba(26, 30, 42, .06), 0 6px 18px rgba(26, 30, 42, .07);
  --font-display: "Shantell Sans", "Segoe Print", "Comic Sans MS", ui-rounded, system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131B; --surface: #191D28; --surface-2: #212635; --ink: #E8EBF2; --ink-soft: #9CA4B8;
    --line: #2E3447; --rule: #26395A; --accent: #FF6B94; --accent-hover: #FF8AAB; --accent-ink: #23060F;
    --accent-soft: #3B1824; --mark: #F2D74E; --mark-band: rgba(242, 215, 78, .32); --good: #52C98E;
    --good-soft: #163026; --bad: #FF7F72; --bad-soft: #3B1D1A; --learning: #E6B04A;
    --gloss: rgba(255, 255, 255, .16); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .32);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131B; --surface: #191D28; --surface-2: #212635; --ink: #E8EBF2; --ink-soft: #9CA4B8;
  --line: #2E3447; --rule: #26395A; --accent: #FF6B94; --accent-hover: #FF8AAB; --accent-ink: #23060F;
  --accent-soft: #3B1824; --mark: #F2D74E; --mark-band: rgba(242, 215, 78, .32); --good: #52C98E;
  --good-soft: #163026; --bad: #FF7F72; --bad-soft: #3B1D1A; --learning: #E6B04A;
  --gloss: rgba(255, 255, 255, .16); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .32);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(26px, 4vw, 34px); }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hl { background: linear-gradient(transparent 58%, var(--mark-band) 58%, var(--mark-band) 92%, transparent 92%); padding-inline: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.tight { gap: 6px; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font: 500 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }

.wrap { max-width: 1040px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap.narrow { max-width: 780px; }
.page { padding-block: 28px 72px; display: flex; flex-direction: column; gap: 28px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 2px; font: 800 21px/1 var(--font-display); color: var(--ink); }
.brand svg { flex: none; }
.topnav { display: flex; gap: 6px; align-items: center; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; line-height: 1.2; text-decoration: none; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); color: var(--surface); border-color: transparent; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; }
.btn.icon { padding: 6px; min-width: 40px; }
.btn.sm.icon { min-width: 34px; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.big { min-height: 56px; font-size: 17px; padding-inline: 22px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.back { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--ink-soft); font-weight: 700; display: inline-flex; gap: 4px; align-items: center; }
.back:hover { color: var(--ink); }
kbd { font: 500 12px/1 var(--font-mono); padding: 3px 6px; border: 1px solid currentColor; border-radius: 4px; opacity: .7; }

/* Inputs */
input[type="text"], input[type="number"], input:not([type]), textarea, select {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); line-height: 1.4;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select { width: auto; padding-block: 7px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.err { color: var(--bad); font-weight: 700; }

/* Library */
.hero { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(22px, 4vw, 44px); box-shadow: var(--shadow); }
.hero-copy { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.hero-copy h1 { font-size: clamp(30px, 5vw, 44px); }
.hero-copy p.lede { font-size: 17px; color: var(--ink-soft); max-width: 46ch; }
.hero-art { position: relative; height: 240px; }
.art-card { position: absolute; inset: 20px 10px; border-radius: 6px; box-shadow: var(--shadow); }
.art-card:nth-child(1) { transform: rotate(-7deg) translate(-8px, 6px); }
.art-card:nth-child(2) { transform: rotate(4deg) translate(10px, -4px); }
.art-card:nth-child(3) { display: flex; flex-direction: column; padding: 14px 20px; }
.art-card .w { margin: auto; font: 800 34px/1 var(--font-display); }
.art-sticky { position: absolute; right: 0; bottom: 4px; background: var(--mark); color: #1A1E2A; font: 700 14px/1.2 var(--font-display); padding: 10px 12px; transform: rotate(3deg); box-shadow: var(--shadow); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-top: 2px solid var(--line); }
.steps li::before { content: "Step " counter(s); font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.steps b { font-family: var(--font-display); font-size: 17px; }
.lib-head { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
.set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; }
.set-card { position: relative; display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 18px; min-height: 150px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 5px 5px 0 -1px var(--surface), 5px 5px 0 0 var(--line); transition: transform .15s, box-shadow .15s; }
.set-card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 -1px var(--surface), 7px 7px 0 0 var(--ink-soft); }
.set-card .t { font: 800 19px/1.2 var(--font-display); overflow-wrap: anywhere; }
.set-card .meta { color: var(--ink-soft); font-size: 14px; margin-top: auto; }
.set-card.new { align-items: center; justify-content: center; border-style: dashed; box-shadow: none; color: var(--accent); font-weight: 700; }
.set-card.new:hover { box-shadow: none; }

/* Mastery bar */
.mbar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.mbar.big { height: 12px; }
.mbar span { display: block; height: 100%; transition: width .4s; }
.m-done { background: var(--good); }
.m-learn { background: var(--learning); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Set page */
.set-head { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-start; }
.set-head > div:first-child { min-width: 0; flex: 1 1 320px; display: flex; flex-direction: column; gap: 8px; }
.set-head h1 { overflow-wrap: anywhere; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.section { display: flex; flex-direction: column; gap: 14px; }
.section-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mode-tile { display: grid; grid-template-columns: 44px 1fr; gap: 4px 14px; align-items: start; text-align: left; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s, transform .15s; }
.mode-tile:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.mode-tile .ic { grid-row: span 3; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.mode-tile .n { font: 800 17px/1.2 var(--font-display); }
.mode-tile .d { font-size: 14px; color: var(--ink-soft); line-height: 1.4; }
.mode-tile .best { font: 500 12px/1.3 var(--font-mono); color: var(--ink-soft); margin-top: 4px; }
.mode-tile:disabled { opacity: .5; cursor: not-allowed; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.terms { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.terms li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 16px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: start; }
.terms li:first-child { border-top: 0; }
.terms .tt { font: 700 16px/1.35 var(--font-display); overflow-wrap: anywhere; white-space: pre-wrap; }
.terms .td { overflow-wrap: anywhere; white-space: pre-wrap; }
.lvl { font: 500 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; justify-self: start; }
.lvl.l1 { color: var(--learning); border: 1px solid var(--learning); }
.lvl.l2 { color: var(--good); border: 1px solid var(--good); }
.star { color: var(--ink-soft); }
.star.on { color: var(--accent); }

/* Editor */
details.import { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.import > summary { cursor: pointer; padding: 16px 20px; font: 800 17px/1.2 var(--font-display); list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.import > summary::-webkit-details-marker { display: none; }
details.import > summary::after { content: "+"; font-family: var(--font-mono); color: var(--accent); }
details.import[open] > summary::after { content: "−"; }
.import-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.import-body textarea { min-height: 150px; font-family: var(--font-mono); font-size: 14px; resize: vertical; }
.seps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { font-weight: 700; font-size: 14px; padding: 0; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 99px; font-size: 14px; font-weight: 700; background: var(--surface); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.custom-sep { width: 90px !important; padding: 6px 10px !important; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.imp-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.imp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.imp-table th, .imp-table td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.imp-table th { border-top: 0; font: 500 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); background: var(--surface-2); }
.ed-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.ed-rows { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.ed-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1.6fr) 40px; gap: 12px; align-items: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.ed-row.err { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.ed-num { padding-top: 10px; color: var(--ink-soft); font-size: 13px; }
.ed-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ed-field textarea { resize: none; overflow: hidden; min-height: 42px; }
.ed-field small { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.ed-foot { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.ed-foot .err { margin-right: auto; }

/* Mode pages */
.mode-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.mode-head .left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mode-head .back { overflow-wrap: anywhere; text-align: left; }
.mode-head .right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hud { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hud .stat { display: flex; flex-direction: column; align-items: flex-end; }
.hud .stat b { font: 500 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.hud .stat span { font: 500 11px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.hint { text-align: center; color: var(--ink-soft); font-size: 13px; }
.center { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(22px, 4vw, 40px); box-shadow: var(--shadow); }
.result .bignum { font: 500 clamp(44px, 9vw, 64px)/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.badge-new { background: var(--mark); color: #1A1E2A; font: 800 14px/1 var(--font-display); padding: 6px 10px; border-radius: 4px; transform: rotate(-2deg); }
.howto { max-width: 52ch; color: var(--ink-soft); }

/* Index card surface */
.indexcard { position: relative; background-color: var(--surface); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px); border-radius: 6px; box-shadow: var(--shadow); }
.indexcard::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46px; background: var(--surface); border-bottom: 2px solid var(--accent); border-radius: 6px 6px 0 0; }
.indexcard > * { position: relative; }

/* Flashcards */
.fc-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.fc-progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; }
.fc-progress span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.fc-stage { perspective: 1800px; }
.flashcard { display: block; width: 100%; height: clamp(260px, 48vh, 430px); cursor: pointer; border-radius: 6px; }
.fc-inner { position: relative; width: 100%; height: 100%; transition: transform .55s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; padding: 14px clamp(18px, 4vw, 36px) 20px; }
.fc-face.back { transform: rotateY(180deg); }
.fc-label { height: 32px; display: flex; align-items: center; font: 500 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.fc-text { flex: 1; display: flex; overflow: auto; min-height: 0; padding-top: 12px; }
.fc-text > span { margin: auto; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
.fc-text.term > span { font-family: var(--font-display); font-weight: 700; }
.sz-l { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.2; }
.sz-m { font-size: clamp(19px, 2.8vw, 24px); line-height: 1.35; }
.sz-s { font-size: 17px; line-height: 1.5; }
.fc-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn.learnbtn { color: var(--learning); }
.btn.knowbtn { color: var(--good); }

/* Questions (Learn and Test) */
.qcard { padding: 14px clamp(18px, 4vw, 32px) 26px; display: flex; flex-direction: column; gap: 14px; min-height: 180px; }
.qlabel { height: 32px; display: flex; align-items: center; font: 500 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.qprompt { white-space: pre-wrap; overflow-wrap: anywhere; padding-top: 8px; }
.qprompt.term { font-family: var(--font-display); font-weight: 700; }
.qhint { font-weight: 700; color: var(--ink-soft); font-size: 14px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; transition: border-color .15s, background .15s; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice .k { flex: none; font: 500 12px/1 var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; color: var(--ink-soft); margin-top: 1px; }
.choice .ct { overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.choice.picked { border-color: var(--accent); background: var(--accent-soft); }
.choice.correct { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; }
.wform { display: flex; flex-direction: column; gap: 10px; }
.wform .row input { flex: 1 1 240px; width: auto; min-width: 0; }
.fb { border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid; }
.fb.good { border-color: var(--good); background: var(--good-soft); }
.fb.bad { border-color: var(--bad); background: var(--bad-soft); }
.fb strong { font-family: var(--font-display); font-size: 18px; }
.fb .ans { overflow-wrap: anywhere; white-space: pre-wrap; }
.fb s { opacity: .75; }
.learn-top { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.round-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; max-width: 520px; }
.round-list li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); overflow-wrap: anywhere; }
.round-list .ok { color: var(--good); font-weight: 700; }
.round-list .no { color: var(--bad); font-weight: 700; }

/* Test */
.tq-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; }
.tq { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.tq.is-ok { border-color: var(--good); }
.tq.is-no { border-color: var(--bad); }
.tq-head { display: flex; justify-content: space-between; gap: 10px; font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.tq-prompt { font-size: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tq-prompt.term { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.tq-pair { padding: 12px 14px; border-left: 3px solid var(--rule); background: var(--surface-2); border-radius: 0 8px 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.tq-verdict { font-weight: 700; }
.tq-verdict.ok { color: var(--good); }
.tq-verdict.no { color: var(--bad); }
.cfg { display: flex; flex-direction: column; gap: 18px; }
.cfg .numrow { display: flex; gap: 10px; align-items: center; }
.cfg .numrow input { width: 96px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks label { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
.checks input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Match */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mtile { min-height: 112px; padding: 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; display: flex; align-items: center; justify-content: center; text-align: center; transition: border-color .12s, background .12s, transform .12s; }
.mtile.term { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.mtile:hover:not(:disabled) { border-color: var(--ink-soft); }
.mtile.sel { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-2px); }
.mtile.bad { animation: shake .35s; border-color: var(--bad); }
.mtile.gone { animation: matched .45s forwards; pointer-events: none; }
@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }
@keyframes matched { 0% { background: var(--good-soft); border-color: var(--good); } 60% { background: var(--good-soft); border-color: var(--good); opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
.penalty { color: var(--bad); font: 500 14px var(--font-mono); }

/* Memory */
.memgrid { display: grid; gap: 10px; }
.mcard { perspective: 1200px; aspect-ratio: 4 / 5; max-width: 100%; padding: 0; border: 0; background: none; border-radius: 10px; }
.mc-inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
.mcard.up .mc-inner, .mcard.done .mc-inner { transform: rotateY(180deg); }
.mc-back, .mc-face { position: absolute; inset: 0; border-radius: 10px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.mc-back { background-color: var(--accent); background-image: radial-gradient(circle at 50% 50%, var(--accent-hover) 0 3px, transparent 3.5px); background-size: 16px 16px; border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.mc-face { transform: rotateY(180deg); background: var(--surface); border: 1.5px solid var(--accent); display: flex; flex-direction: column; gap: 4px; padding: 8px; overflow: auto; text-align: center; }
.mc-label { font: 500 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.mc-text { margin: auto; font-size: 13px; line-height: 1.3; overflow-wrap: anywhere; white-space: pre-wrap; }
.mc-text.term { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.mcard.done .mc-face { border-color: var(--good); background: var(--good-soft); }

/* Bubble Pop */
.b-prompt { padding: 10px clamp(16px, 3vw, 28px) 18px; min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
.b-prompt .qprompt { font-size: 18px; padding-top: 4px; }
.b-reveal { font-weight: 700; color: var(--bad); min-height: 1.5em; }
.arena { position: relative; height: clamp(340px, 56vh, 520px); overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(to top, var(--accent-soft), var(--surface) 75%); }
.bubble { position: absolute; bottom: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px 12px; min-height: 80px; border-radius: 44px; border: 2px solid var(--accent); background: radial-gradient(circle at 28% 22%, var(--gloss), transparent 42%), var(--surface); color: var(--ink); font: 700 15px/1.25 var(--font-display); will-change: transform; overflow-wrap: anywhere; }
.bubble .bnum { position: absolute; top: -9px; left: 50%; translate: -50% 0; font: 500 11px/1 var(--font-mono); background: var(--accent); color: var(--accent-ink); padding: 3px 6px; border-radius: 99px; }
.bubble.pop { animation: pop .35s forwards; pointer-events: none; }
.bubble.dud { opacity: .45; border-color: var(--ink-soft); cursor: default; }
.bubble.reveal { border-color: var(--good); box-shadow: 0 0 0 4px var(--good-soft); }
@keyframes pop { to { scale: 1.45; opacity: 0; } }
.hearts { display: flex; gap: 4px; color: var(--accent); }
.hearts .lost { color: var(--line); }

/* Lightning */
.tbar { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.tbar span { display: block; height: 100%; background: var(--accent); }
.tbar.low span { background: var(--bad); }
.lt-card { padding: 10px clamp(18px, 4vw, 32px) 24px; display: flex; flex-direction: column; gap: 4px; min-height: 230px; }
.lt-term { font: 700 clamp(22px, 3.6vw, 30px)/1.2 var(--font-display); overflow-wrap: anywhere; padding-bottom: 8px; }
.lt-def { font-size: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.lt-card.flash-good { animation: flashg .4s; }
.lt-card.flash-bad { animation: flashb .4s; }
@keyframes flashg { from { box-shadow: 0 0 0 6px var(--good); } }
@keyframes flashb { from { box-shadow: 0 0 0 6px var(--bad); } }
.lt-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn.yes { color: var(--good); border-color: var(--good); }
.btn.no { color: var(--bad); border-color: var(--bad); }
.mult { font: 800 18px/1 var(--font-display); color: var(--accent); }

/* Unscramble */
.us-clue { padding: 10px clamp(18px, 4vw, 32px) 22px; min-height: 140px; display: flex; flex-direction: column; gap: 4px; }
.slots { display: flex; flex-wrap: wrap; gap: 14px 20px; justify-content: center; }
.slots .word { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.slot { width: 38px; height: 48px; display: grid; place-items: center; border-bottom: 3px solid var(--line); font: 800 24px/1 var(--font-display); background: none; border-top: 0; border-left: 0; border-right: 0; padding: 0; color: var(--ink); }
.slot.filled { border-bottom-color: var(--ink); }
.slot.locked { color: var(--accent); border-bottom-color: var(--accent); cursor: default; }
.slot.fixed { border-bottom-color: transparent; color: var(--ink-soft); cursor: default; width: auto; min-width: 14px; }
.slots.solved .slot { color: var(--good); border-bottom-color: var(--good); }
.slots.revealed .slot { color: var(--bad); }
.slots.bad { animation: shake .35s; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { width: 46px; height: 50px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: 0 3px 0 var(--line); font: 800 22px/1 var(--font-display); padding: 0; }
.tile:hover { border-color: var(--accent); }
.tile.used { visibility: hidden; }

/* Modal, toast, footer */
#modal-root { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.scrim { position: absolute; inset: 0; background: rgba(10, 12, 18, .5); }
.modal { position: relative; width: min(540px, 100%); max-height: calc(100% - 20px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); }
.modal textarea { font-family: var(--font-mono); font-size: 13px; min-height: 180px; resize: vertical; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 60; max-width: min(520px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-weight: 700; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; transform: translateY(8px); }
#toast.show { opacity: 1; transform: none; }
.foot { border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13px; }
.foot .wrap { padding-block: 18px 28px; }

@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .hero-art { height: 190px; }
  .steps { grid-template-columns: 1fr; }
  .terms li { grid-template-columns: minmax(0, 1fr) auto; }
  .terms li .td { grid-column: 1 / -1; grid-row: 2; }
  .ed-row { grid-template-columns: minmax(0, 1fr) 40px; }
  .ed-num { display: none; }
  .ed-row .ed-field:nth-of-type(2) { grid-column: 1; }
  .ed-row .btn { grid-column: 2; grid-row: 1; }
  .choices { grid-template-columns: 1fr; }
  .topnav .hide-sm { display: none; }
  .slot { width: 30px; height: 42px; font-size: 20px; }
  .tile { width: 40px; height: 46px; font-size: 20px; }
  .fc-actions { gap: 8px; }
  .fc-actions kbd, .lt-btns kbd { display: none; }
  .fc-actions .btn:not(.icon) { padding-inline: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .fc-inner, .mc-inner, .set-card, .mode-tile, .mbar span { transition: none; }
  .mtile.bad, .slots.bad { animation: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Cramberry home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="8" width="21" height="16" rx="2" transform="rotate(-9 13 16)" style="fill:var(--surface);stroke:var(--ink-soft)" stroke-width="1.6"/>
        <rect x="6" y="10" width="21" height="16" rx="2" style="fill:var(--surface);stroke:var(--ink)" stroke-width="1.8"/>
        <path d="M6 15h21" style="stroke:var(--accent)" stroke-width="1.8"/>
        <circle cx="21" cy="21" r="4.2" style="fill:var(--accent)"/>
        <path d="M21 16.8c.4-1.6 1.5-2.6 3-3" style="stroke:var(--good)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      Cramberry
    </button>
    <nav class="topnav" aria-label="Main">
      <button class="btn ghost sm" id="nav-library" type="button">My sets</button>
      <button class="btn ghost sm hide-sm" id="nav-import" type="button">Import</button>

    </nav>
  </div>
</header>
<main id="app"></main>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<div id="modal-root" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

const app = document.getElementById('app');
const modalRoot = document.getElementById('modal-root');
const toastEl = document.getElementById('toast');
const footEl = document.getElementById('foot');

/* ---------- small utilities ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const sideLabel = s => s === 'term' ? 'Term' : 'Definition';
const other = s => s === 'term' ? 'def' : 'term';
const LETTER = /[\p{L}\p{N}]/u;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function norm(s) {
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
}
function loose(s) {
  return String(s ?? '').normalize('NFC').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
}
// Comparison key: ignores case, punctuation and accents; falls back to raw text for symbol-only answers.
const key = s => norm(s) || String(s ?? '').trim().toLowerCase();

function lev(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

// Grade a typed answer against the correct text. Forgiving about case, punctuation,
// a missing parenthetical, alternatives split by "/" or ";", and a one-letter typo.
function grade(input, target) {
  const a = key(input);
  if (!String(input ?? '').trim()) return { ok: false, note: null };
  const candidates = [target];
  const noParen = String(target).replace(/\([^)]*\)/g, ' ');
  if (noParen.trim() && noParen !== target) candidates.push(noParen);
  if (/[\/;]/.test(target)) String(target).split(/[\/;]/).forEach(p => { if (p.trim()) candidates.push(p); });
  for (const t of candidates) {
    if (a === key(t)) {
      const la = loose(input), lt = loose(t);
      if (la && lt && la !== lt && norm(input) === norm(t)) return { ok: true, note: 'Watch the accents: ' + t.trim() };
      return { ok: true, note: null };
    }
  }
  const b = key(target);
  const d = lev(a, b);
  if ((b.length >= 6 && d <= 1) || (b.length >= 12 && d <= 2)) return { ok: true, note: 'Close enough. Exact spelling: ' + String(target).trim() };
  return { ok: false, note: null };
}

function sizeClass(t) {
  const n = String(t).length;
  return n > 160 ? 'sz-s' : n > 60 ? 'sz-m' : 'sz-l';
}
function fmtTime(ms) {
  const s = Math.max(0, ms) / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  return Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0');
}
function ago(t) {
  const d = (Date.now() - t) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + ' min ago';
  if (d < 86400) return plural(Math.floor(d / 3600), 'hour') + ' ago';
  if (d < 86400 * 30) return plural(Math.floor(d / 86400), 'day') + ' ago';
  return new Date(t).toLocaleDateString();
}
function sides(answerWith) {
  return answerWith === 'def' ? { p: 'term', a: 'def' } : { p: 'def', a: 'term' };
}

/* ---------- icons ---------- */
const svg = (inner, s = 20, vb = 24) => `<svg viewBox="0 0 ${vb} ${vb}" width="${s}" height="${s}" aria-hidden="true">${inner}</svg>`;
const STROKE = 'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const STAR_PATH = 'M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.6l-5.1 2.7 1-5.7-4.1-4 5.7-.8z';
const ICON = {
  star: svg(`<path d="${STAR_PATH}" ${STROKE}/>`, 18),
  starOn: svg(`<path d="${STAR_PATH}" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>`, 18),
  speak: svg(`<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" ${STROKE}/>`, 18),
  left: svg(`<path d="M14.5 6l-6 6 6 6" ${STROKE}/>`),
  right: svg(`<path d="M9.5 6l6 6-6 6" ${STROKE}/>`),
  trash: svg(`<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" ${STROKE}/>`, 18),
  heart: svg('<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0112 7.4 4.3 4.3 0 0119.5 10c0 5.4-7.5 10-7.5 10z" fill="currentColor"/>', 20),
};
const MODE_ICON = {
  flashcards: svg(`<rect x="5" y="7" width="17" height="12" rx="2" transform="rotate(-8 13 13)" ${STROKE}/><rect x="9" y="11" width="17" height="12" rx="2" style="fill:var(--accent-soft)" stroke="currentColor" stroke-width="1.9"/><path d="M9 15h17" ${STROKE}/>`, 26, 32),
  learn: svg(`<path d="M16 28V15" ${STROKE}/><path d="M16 16c0-5-4-8-9-8 0 5 4 8 9 8zM16 13c0-4 3-7 8-7 0 4-3 7-8 7z" ${STROKE}/>`, 26, 32),
  test: svg(`<rect x="7" y="5" width="18" height="23" rx="2" ${STROKE}/><path d="M11 12l2 2 4-4M11 20h10M11 24h7" ${STROKE}/>`, 26, 32),
  match: svg(`<rect x="4" y="6" width="11" height="11" rx="2" ${STROKE}/><rect x="17" y="15" width="11" height="11" rx="2" ${STROKE}/><path d="M15 11.5h3.5v3.5" ${STROKE}/>`, 26, 32),
  memory: svg(`<rect x="5" y="5" width="9.5" height="10" rx="2" ${STROKE}/><rect x="17.5" y="5" width="9.5" height="10" rx="2" fill="currentColor"/><rect x="5" y="18" width="9.5" height="10" rx="2" fill="currentColor"/><rect x="17.5" y="18" width="9.5" height="10" rx="2" ${STROKE}/>`, 26, 32),
  bubble: svg(`<circle cx="12" cy="19" r="7" ${STROKE}/><circle cx="23" cy="10" r="4.5" ${STROKE}/><circle cx="24" cy="24" r="2.5" ${STROKE}/><path d="M9 16a3.5 3.5 0 013-2" ${STROKE}/>`, 26, 32),
  lightning: svg(`<path d="M18 3L7 18h8l-2 11 12-16h-8z" ${STROKE}/>`, 26, 32),
  unscramble: svg(`<rect x="3" y="9" width="12" height="14" rx="2" ${STROKE}/><rect x="17" y="9" width="12" height="14" rx="2" ${STROKE}/><text x="9" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="sans-serif">B</text><text x="23" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="sans-serif">A</text>`, 26, 32),
};

/* ---------- preferences (per browser) ---------- */
const PREF_KEY = 'cramberry.prefs.v1';
let prefs = { answerWith: 'term', fcFront: 'term', starredOnly: {} };
try {
  const p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null');
  if (p && typeof p === 'object') prefs = { ...prefs, ...p, starredOnly: { ...(p.starredOnly || {}) } };
} catch (e) { /* storage unavailable; defaults are fine */ }
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ } }

/* ---------- storage: your account when available, this browser otherwise ---------- */
const LOCAL_KEY = 'cramberry.sets.v1';
const MAX_BYTES = 240000;
const Store = { mode: 'loading', sets: new Map(), col: null, inflight: new Set(), pending: new Set(), timers: new Map() };

function normalizeSet(s, forcedId) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.cards)) return null;
  const cards = s.cards.filter(c => c && typeof c === 'object').map(c => ({
    id: typeof c.id === 'string' && c.id ? c.id : newId(),
    term: String(c.term ?? ''),
    def: String(c.def ?? ''),
  }));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  return {
    id: forcedId || (typeof s.id === 'string' && s.id) || newId(),

      }).join('')}</ul>
    </section>
  </div>`;
  bind('#to-lib', () => navigate({ view: 'library' }));
  bind('#s-edit', () => go({ view: 'edit', setId: set.id }));
  bind('#s-export', () => openExport(set));
  bind('#s-delete', () => confirmBox({

  }));
  bind('#s-reset', () => confirmBox({
    title: 'Reset progress?', body: 'Every card goes back to “not started”. Your stars and best scores stay.', ok: 'Reset progress', danger: true,
    onOk: () => {
      const np = {};
      Object.keys(set.progress).forEach(id => { if (set.progress[id] && set.progress[id].s) np[id] = { s: true }; });
      set.progress = np;
      persist(set);
      go({ view: 'set', setId: set.id });
    },
  }));
  bind('#s-staronly', e => { prefs.starredOnly[set.id] = e.target.checked; savePrefs(); go({ view: 'set', setId: set.id }); }, 'change');
  app.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => go({ view: b.dataset.mode, setId: set.id })));
  app.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', () => {
    const on = toggleStar(set, b.dataset.star);
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = on ? ICON.starOn : ICON.star;
    const scroll = window.scrollY;
    const hadToggle = !!$('#s-staronly');
    const nowAny = set.cards.some(x => prog(set, x.id).s);
    if (hadToggle !== nowAny || (prefs.starredOnly[set.id] && hadToggle)) { go({ view: 'set', setId: set.id }); window.scrollTo(0, scroll); }
  }));
}

/* ---------- export ---------- */
let downloadsP = null;
function getDownloads() {
  if (!downloadsP) {
    downloadsP = (window.claude && typeof window.claude.use === 'function')
      ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
      : Promise.resolve({
        // Outside Claude (the standalone copy), a plain browser download works.
        save: ({ filename, data }) => {
          const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          return Promise.resolve({ status: 'saved' });
        },
      });
  }
  return downloadsP;
}
function csvCell(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
function openExport(set) {
  const tsv = set.cards.map(c => `${c.term.replace(/[\t\r\n]+/g, ' ')}\t${c.def.replace(/[\t\r\n]+/g, ' ')}`).join('\n');
  openModal(`<h2>Export “${esc(set.title)}”</h2>
    <p class="muted">One card per line, with a tab between term and definition. Paste it into a spreadsheet, a doc, or back into Cramberry.</p>
    <label class="sr" for="ex-text">Exported cards</label>
    <textarea id="ex-text" readonly>${esc(tsv)}</textarea>
    <div class="row end">
      <button class="btn" type="button" data-close>Close</button>
      <button class="btn" type="button" id="ex-dl" hidden>Download .csv</button>
      <button class="btn primary" type="button" id="ex-copy" data-autofocus>Copy</button>
    </div>`, m => {
    const ta = m.querySelector('#ex-text');
    m.querySelector('#ex-copy').addEventListener('click', () => {
      const fallback = () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl+C (or ⌘C on a Mac) to copy.'); };
      try {
        navigator.clipboard.writeText(tsv).then(() => toast(`Copied ${plural(set.cards.length, 'card')}.`), fallback);
      } catch (e) { fallback(); }
    });
    getDownloads().then(dl => {
      const btn = m.querySelector('#ex-dl');
      if (!dl || !btn) return;
      btn.hidden = false;
      btn.addEventListener('click', async () => {
        const csv = 'term,definition\n' + set.cards.map(c => csvCell(c.term) + ',' + csvCell(c.def)).join('\n');
        const name = (set.title.replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'cramberry-set') + '.csv';
        try {
          await dl.save({ filename: name, data: csv });
          toast('Saved ' + name);
        } catch (e) {
          if (e && e.code === 'declined') return;
          if (e && e.code === 'rate_limited') { toast('A save prompt is already open.'); return; }
          toast('Downloading isn’t available here. Use Copy instead.');
          btn.hidden = true;
        }
      });
    });
  });
}

/* ---------- import parsing ---------- */
const TERM_SEPS = { tab: '\t', comma: ',', dash: /\s+[-–—]+\s+/, colon: ':' };
const CARD_SEPS = { newline: '\n', semicolon: ';' };
function findSep(line, sep) {
  if (sep instanceof RegExp) { const m = line.match(sep); return m ? { i: m.index, len: m[0].length } : null; }
  const i = line.indexOf(sep);
  return i < 0 ? null : { i, len: sep.length };
}
const HEAD_T = ['term', 'terms', 'word', 'words', 'front', 'question', 'vocab', 'vocabulary'];
const HEAD_D = ['definition', 'definitions', 'meaning', 'meanings', 'back', 'answer', 'answers', 'def'];
function dropHeader(cards) {
  if (cards.length && HEAD_T.includes(norm(cards[0].term)) && HEAD_D.includes(norm(cards[0].def))) cards.shift();
  return cards;
}
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', q = false, startOfField = true;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"' && startOfField) { q = true; startOfField = false; }
    else if (ch === ',') { row.push(field); field = ''; startOfField = true; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; startOfField = true; }
    else { field += ch; if (ch !== ' ') startOfField = false; }
  }
  row.push(field); rows.push(row);
  const cards = []; let skipped = 0;
  rows.forEach(r => {
    if (r.length === 1 && !r[0].trim()) return;
    const term = (r[0] || '').trim(), def = r.slice(1).join(',').trim();
    if (r.length < 2 || !term || !def) { skipped++; return; }
    cards.push({ term, def });
  });
  return { cards: dropHeader(cards), skipped };
}
function parseImport(text, termSep, cardSep) {
  text = text.replace(/\r\n?/g, '\n');
  if (termSep === ',' && cardSep === '\n') return parseCSV(text);
  const chunks = text.split(cardSep);
  const cards = []; let skipped = 0;
  for (const raw of chunks) {
    const line = raw.trim();
    if (!line) continue;
    const f = findSep(line, termSep);
    if (!f) { skipped++; continue; }
    const term = line.slice(0, f.i).trim(), def = line.slice(f.i + f.len).trim();
    if (!term || !def) { skipped++; continue; }
    cards.push({ term, def });
  }
  return { cards: dropHeader(cards), skipped };
}
function detectSeps(text) {
  text = text.replace(/\r\n?/g, '\n');
  let lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return null;
  let card = 'newline';
  if (lines.length <= 2 && (text.match(/;/g) || []).length >= 2) {
    card = 'semicolon';
    lines = text.split(';').map(l => l.trim()).filter(Boolean);
  }
  const sample = lines.slice(0, 60);
  const share = re => sample.filter(l => re.test(l)).length / sample.length;
  let term = null;
  if (share(/\t/) >= 0.5) term = 'tab';
  else if (share(/\s[-–—]+\s/) >= 0.6) term = 'dash';
  else if (share(/:/) >= 0.6) term = 'colon';
  else if (share(/,/) >= 0.6) term = 'comma';
  return term ? { term, card } : { term: null, card };
}

    updateCount();
  };

    ed.rows.push(blank());
    list.insertAdjacentHTML('beforeend', rowHTML(ed.rows[ed.rows.length - 1], ed.rows.length - 1));
    updateCount();
    if (focus) { const ta = list.lastElementChild.querySelector('textarea'); ta.focus(); ta.scrollIntoView({ block: 'nearest' }); }

  bind('#ed-desc', e => { ed.desc = e.target.value; ed.dirty = true; }, 'input');
  list.addEventListener('input', e => {
    const ta = e.target.closest('textarea'); if (!ta) return;
    const li = ta.closest('.ed-row');
    ed.rows[+li.dataset.i][ta.dataset.f] = ta.value;
    ed.dirty = true;
    li.classList.remove('err');
    grow(ta);
    updateCount();
  });
  list.addEventListener('keydown', e => {
    const ta = e.target.closest('textarea'); if (!ta) return;
    const li = ta.closest('.ed-row');
    if (e.key === 'Tab' && !e.shiftKey && ta.dataset.f === 'def' && +li.dataset.i === ed.rows.length - 1) { e.preventDefault(); addRow(true); }
  });

    ed.rows.splice(+b.dataset.del, 1);
    if (!ed.rows.length) ed.rows.push(blank());
    ed.dirty = true;
    drawRows();
  });
  bind('#ed-add', () => addRow(true));
  bind('#ed-swap', () => {
    ed.rows.forEach(r => { const t = r.term; r.term = r.def; r.def = t; });
    ed.dirty = true;
    drawRows();
    toast('Swapped terms and definitions.');
  });

  // Import panel
  const impText = $('#imp-text'), preview = $('#imp-preview'), addBtn = $('#imp-add');
  let parsed = { cards: [], skipped: 0 };
  const radio = name => (app.querySelector(`input[name="${name}"]:checked`) || {}).value;
  const currentSeps = () => {
    const t = radio('tsep'), c = radio('csep');
    const term = t === 'custom' ? ($('#tsep-custom-val').value || null) : TERM_SEPS[t];
    const card = c === 'custom' ? ($('#csep-custom-val').value || '\n') : CARD_SEPS[c];

  };
  const updatePreview = () => {
    const text = impText.value;

    const n = parsed.cards.length;
    const sk = parsed.skipped ? ` <span class="muted">· ${plural(parsed.skipped, 'line')} skipped because no separator was found</span>` : '';
    preview.innerHTML = n
      ? `<p><strong>${plural(n, 'card')} found</strong>${sk}</p>
         <div class="imp-table-wrap"><table class="imp-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
         ${parsed.cards.slice(0, 6).map(c => `<tr><td>${esc(c.term)}</td><td>${esc(c.def)}</td></tr>`).join('')}
         </tbody></table></div>${n > 6 ? `<p class="muted">and ${n - 6} more</p>` : ''}`
      : `<p class="err">No cards found. Pick the separator your list uses between each term and its definition.</p>${sk ? `<p class="muted">${plural(parsed.skipped, 'line')} had no separator.</p>` : ''}`;
    addBtn.disabled = !n;
    addBtn.textContent = n ? `Add ${plural(n, 'card')}` : 'Add cards';
  };
  const applyDetect = () => {
    const d = detectSeps(impText.value);
    if (!d) return;
    if (d.term) { const r = app.querySelector(`#tsep-${d.term}`); if (r) r.checked = true; }
    const rc = app.querySelector(`#csep-${d.card}`); if (rc) rc.checked = true;
  };
  let pt = null;
  impText.addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(updatePreview, 150); });
  impText.addEventListener('paste', () => setTimeout(() => { applyDetect(); updatePreview(); }, 0));
  app.querySelectorAll('input[name="tsep"], input[name="csep"]').forEach(r => r.addEventListener('change', updatePreview));
  ['#tsep-custom-val', '#csep-custom-val'].forEach(sel => bind(sel, e => {
    const which = sel.startsWith('#tsep') ? '#tsep-custom' : '#csep-custom';
    if (e.target.value) $(which).checked = true;
    updatePreview();
  }, 'input'));
  bind('#imp-file', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { preview.innerHTML = `<p class="err">That file is over 5 MB. Split it into smaller files and import them one at a time.</p>`; e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      impText.value = String(reader.result || '');
      if (/\.csv$/i.test(f.name) && !impText.value.includes('\t')) { $('#tsep-comma').checked = true; $('#csep-newline').checked = true; }
      else applyDetect();
      updatePreview();
      e.target.value = '';
    };
    reader.onerror = () => { preview.innerHTML = `<p class="err">Couldn’t read that file. Try saving it as .csv or .txt.</p>`; };
    reader.readAsText(f);
  }, 'change');
  bind('#imp-add', () => {
    if (!parsed.cards.length) return;
    while (ed.rows.length && !ed.rows[ed.rows.length - 1].term.trim() && !ed.rows[ed.rows.length - 1].def.trim()) ed.rows.pop();
    const room = 2000 - ed.rows.length;
    const add = parsed.cards.slice(0, Math.max(0, room));
    add.forEach(c => ed.rows.push({ id: newId(), term: c.term, def: c.def }));
    if (!ed.rows.length) ed.rows.push(blank());
    ed.dirty = true;
    drawRows();
    impText.value = '';
    updatePreview();
    $('#imp').open = false;
    toast(add.length < parsed.cards.length
      ? `Added ${plural(add.length, 'card')}. A set holds up to 2,000 cards, so the rest were left out.`
      : `Added ${plural(add.length, 'card')}. Check them below, then save.`);
    $('#ed-count').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  updatePreview();

  const leave = () => navigate(existing ? { view: 'set', setId: existing.id } : { view: 'library' });
  bind('#ed-back', leave);
  bind('#ed-cancel', leave);
  bind('#ed-save', () => {
    const errEl = $('#ed-err');
    errEl.textContent = '';
    list.querySelectorAll('.ed-row.err').forEach(li => li.classList.remove('err'));
    const bad = [];
    const cards = [];
    ed.rows.forEach((r, i) => {
      const t = r.term.trim(), d = r.def.trim();
      if (!t && !d) return;
      if (!t || !d) { bad.push(i); return; }
      cards.push({ id: r.id, term: t, def: d });
    });
    if (bad.length) {
      bad.forEach(i => { const li = list.querySelector(`[data-i="${i}"]`); if (li) li.classList.add('err'); });
      errEl.textContent = bad.length === 1 ? `Card ${bad[0] + 1} is missing a side. Fill it in or delete it.` : `${bad.length} cards are missing a side. Fill them in or delete them.`;
      const first = list.querySelector('.ed-row.err');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (cards.length < 2) { errEl.textContent = 'Add at least two cards to make a set.'; return; }
    const set = existing ? plain(existing) : normalizeSet({ cards: [] });
    set.title = ed.title.trim() || 'Untitled set';
    set.description = ed.desc.trim();
    set.cards = cards;
    const keep = new Set(cards.map(c => c.id));
    Object.keys(set.progress).forEach(id => { if (!keep.has(id)) delete set.progress[id]; });
    if (byteSize(set) > MAX_BYTES) { errEl.textContent = 'This set is too large to save. Split it into two smaller sets.'; return; }
    ed.dirty = false;
    persist(set);
    go({ view: 'set', setId: set.id });
    toast(existing ? 'Saved your changes.' : `Created “${set.title}”.`);
  });
  if (importOpen) setTimeout(() => impText.focus(), 50);
}
