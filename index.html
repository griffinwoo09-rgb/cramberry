<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cramberry is a free study app. Paste a vocab list and study it with flashcards, quizzes and games.">
<meta name="theme-color" content="#0A0B0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230A0B0A'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='20' fill='%235BD08A'%3EC%3C/text%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cramberry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap">
<style>
/* Layout: one left-aligned column (max 980px). Plain ruled lists instead of card grids; each study mode gets a single focused panel. Committed black theme with one green. */
:root {
  color-scheme: dark;
  --bg: #0A0B0A;
  --panel: #121512;
  --panel-2: #1A1E1A;
  --line: #272C27;
  --line-2: #3D453D;
  --text: #ECEFE9;
  --text-2: #B0B7AD;
  --green: #5BD08A;
  --green-2: #84E2A8;
  --green-dim: #14301F;
  --on-green: #03140A;
  --red: #FF8572;
  --red-dim: #3A1711;
  --amber: #E9BA4C;
  --amber-dim: #352A10;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
::selection { background: var(--green); color: var(--on-green); }
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.2vw, 36px); font-weight: 700; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--green); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.tight { gap: 6px; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.wrap { max-width: 980px; margin-inline: auto; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.wrap.narrow { max-width: 760px; }
.page { padding-block: 32px 80px; display: flex; flex-direction: column; gap: 32px; }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { background: none; border: 0; padding: 2px 0; font: 700 22px/1 var(--serif); color: var(--text); letter-spacing: -.01em; }
.brand span { color: var(--green); }
.topnav { display: flex; gap: 4px; align-items: center; }
.navlink { background: none; border: 0; padding: 8px 10px; color: var(--text-2); font-weight: 600; border-radius: 4px; }
.navlink:hover, .navlink[aria-current="page"] { color: var(--text); }
.navlink[aria-current="page"] { text-decoration: underline; text-decoration-color: var(--green); text-decoration-thickness: 2px; text-underline-offset: 6px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 15px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); font-weight: 600; font-size: 15px; line-height: 1.2; transition: background .12s, border-color .12s; }
.btn:hover:not(:disabled) { border-color: var(--text-2); background: var(--panel-2); }
.btn.primary { background: var(--green); color: var(--on-green); border-color: var(--green); font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: var(--green-2); border-color: var(--green-2); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.quiet:hover:not(:disabled) { color: var(--text); background: var(--panel); border-color: transparent; }
.btn.danger { color: var(--red); }
.btn.danger-fill { background: var(--red); border-color: var(--red); color: #1A0603; font-weight: 700; }
.btn.sm { min-height: 34px; padding: 5px 11px; font-size: 14px; }
.btn.icon { padding: 6px; min-width: 40px; }
.btn.sm.icon { min-width: 34px; }
.btn.on { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.btn.big { min-height: 52px; font-size: 17px; padding-inline: 22px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--green); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.link:hover { color: var(--green-2); }
.back { align-self: flex-start; background: none; border: 0; padding: 2px 0; color: var(--text-2); font-weight: 600; display: inline-flex; gap: 2px; align-items: center; text-align: left; overflow-wrap: anywhere; }
.back:hover { color: var(--text); }
kbd { font: 400 12px/1 var(--mono); padding: 2px 5px; border: 1px solid currentColor; border-radius: 3px; opacity: .65; }

/* Inputs */
input[type="text"], input[type="number"], textarea, select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--panel); color: var(--text); line-height: 1.45;
}
input::placeholder, textarea::placeholder { color: #7D857A; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
select { width: auto; padding-block: 7px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
.err { color: var(--red); font-weight: 600; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* Progress bar */
.mbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.mbar.big { height: 8px; }
.mbar span { display: block; height: 100%; transition: width .4s; }
.m-done { background: var(--green); }
.m-learn { background: var(--amber); }

/* Library */
.intro { display: flex; flex-direction: column; gap: 12px; max-width: 62ch; }
.lede { color: var(--text-2); font-size: 17px; }
.quick { display: flex; flex-direction: column; gap: 12px; }
.quick textarea { min-height: 180px; font-family: var(--mono); font-size: 14px; resize: vertical; }
.lib-head { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; }
.set-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.set-list li { border-bottom: 1px solid var(--line); }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) 200px 130px; gap: 6px 24px; width: 100%; padding: 16px 2px; background: none; border: 0; text-align: left; align-items: center; color: inherit; }
.set-row:hover .sr-title { color: var(--green); }
.sr-title { font: 600 19px/1.3 var(--serif); overflow-wrap: anywhere; }
.sr-sub { display: block; color: var(--text-2); font-size: 14px; margin-top: 2px; }
.sr-prog { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-2); }
.sr-date { color: var(--text-2); font-size: 13px; text-align: right; }

/* Set page */
.set-head { display: flex; flex-direction: column; gap: 10px; }
.set-head h1 { overflow-wrap: anywhere; }
.set-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-2); font-size: 15px; }
.set-meta b { color: var(--text); font-weight: 600; }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.prog-line { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; }
.modes section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.modes .shead { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: baseline; }
.mode-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.mode-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; width: 100%; padding: 13px 2px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; color: inherit; align-items: center; }
.mode-row .n { font-weight: 700; font-size: 17px; }
.mode-row .d { grid-column: 1; color: var(--text-2); font-size: 14px; line-height: 1.45; }
.mode-row .b { grid-column: 2; grid-row: 1 / span 2; font: 400 13px/1.3 var(--mono); color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.mode-row:hover:not(:disabled) .n { color: var(--green); }
.mode-row:hover:not(:disabled) .b { color: var(--green); }
.mode-row:disabled { cursor: not-allowed; opacity: .45; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; color: var(--text-2); }
.toggle input { width: 17px; height: 17px; accent-color: var(--green); }
.entries { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.entry { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) auto; gap: 4px 24px; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: start; }
.entry .hw { font: 600 17px/1.4 var(--serif); overflow-wrap: anywhere; white-space: pre-wrap; }
.entry .df { overflow-wrap: anywhere; white-space: pre-wrap; padding-top: 1px; }
.entry .lv { display: block; font-family: var(--sans); font-weight: 400; font-size: 13px; margin-top: 2px; }
.lv.l1 { color: var(--amber); }
.lv.l2 { color: var(--green); }
.star { color: var(--text-2); margin-top: -6px; }
.star.on { color: var(--green); }

/* Editor */
details.import { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
details.import > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.import > summary::-webkit-details-marker { display: none; }
details.import > summary::after { content: "Show"; font-weight: 400; color: var(--green); font-size: 14px; }
details.import[open] > summary::after { content: "Hide"; }
.import-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.import-body textarea { min-height: 150px; font-family: var(--mono); font-size: 14px; resize: vertical; }
.seps { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 8px; color: var(--text-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line-2); border-radius: 4px; font-size: 14px; font-weight: 600; background: var(--bg); }
.chip input:checked + span { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.chip input:focus-visible + span { outline: 2px solid var(--green); outline-offset: 2px; }
.custom-sep { width: 90px !important; padding: 5px 10px !important; }
.imp-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 5px; }
.imp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.imp-table th, .imp-table td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.imp-table th { border-top: 0; font-weight: 600; color: var(--text-2); background: var(--panel-2); }
.ed-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.ed-rows { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ed-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1.6fr) 40px; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ed-row.err .ed-field textarea { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.ed-num { padding-top: 10px; color: var(--text-2); font-size: 13px; text-align: right; }
.ed-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ed-field textarea { resize: none; overflow: hidden; min-height: 44px; }
.ed-field small { font-size: 12px; color: var(--text-2); }
.ed-foot { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.ed-foot .err { margin-right: auto; }

/* Mode pages */
.mode-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: flex-end; justify-content: space-between; }
.mode-head .left { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hud { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat b { font: 500 24px/1 var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-2); margin-top: 3px; }
.hint { color: var(--text-2); font-size: 13px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; }
.side { font-size: 13px; color: var(--text-2); }
.result { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding-block: 8px; }
.result .bignum { font: 500 clamp(46px, 9vw, 68px)/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--text); }
.result .newbest { color: var(--green); font-weight: 700; }
.howto { max-width: 60ch; color: var(--text-2); }

/* Flashcards */
.fc-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.fc-progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.fc-progress span { display: block; height: 100%; background: var(--green); transition: width .3s; }
.fc-stage { perspective: 1800px; }
.flashcard { display: block; width: 100%; height: clamp(260px, 50vh, 440px); cursor: pointer; border-radius: 8px; }
.fc-inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
.flashcard.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; padding: 16px clamp(18px, 4vw, 36px) 22px; }
.fc-face.back { transform: rotateY(180deg); }
.fc-text { flex: 1; display: flex; overflow: auto; min-height: 0; padding-top: 8px; }
.fc-text > span { margin: auto; text-align: center; white-space: pre-wrap; overflow-wrap: anywhere; }
.fc-text.term > span { font-family: var(--serif); font-weight: 600; }
.sz-l { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.2; }
.sz-m { font-size: clamp(19px, 2.8vw, 24px); line-height: 1.38; }
.sz-s { font-size: 17px; line-height: 1.5; }
.fc-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn.learnbtn { color: var(--amber); }
.btn.knowbtn { color: var(--green); }

/* Questions (Learn and Test) */
.qcard { padding: 16px clamp(18px, 4vw, 30px) 24px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; }
.qprompt { white-space: pre-wrap; overflow-wrap: anywhere; }
.qprompt.term { font-family: var(--serif); font-weight: 600; }
.qhint { font-weight: 600; color: var(--text-2); font-size: 15px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.choice { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 13px 15px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); min-width: 0; transition: border-color .12s, background .12s; }
.choice:hover:not(:disabled) { border-color: var(--text-2); }
.choice .k { flex: none; font: 400 12px/1 var(--mono); border: 1px solid var(--line-2); border-radius: 3px; padding: 4px 6px; color: var(--text-2); margin-top: 2px; }
.choice .ct { overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.choice.picked { border-color: var(--green); background: var(--green-dim); }
.choice.correct { border-color: var(--green); background: var(--green-dim); }
.choice.wrong { border-color: var(--red); background: var(--red-dim); }
.choice:disabled { cursor: default; }
.wform { display: flex; flex-direction: column; gap: 10px; }
.wform .row input { flex: 1 1 240px; width: auto; min-width: 0; }
.fb { border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid; }
.fb.good { border-color: var(--green); background: var(--green-dim); }
.fb.bad { border-color: var(--red); background: var(--red-dim); }
.fb strong { font-size: 17px; }
.fb .ans { overflow-wrap: anywhere; white-space: pre-wrap; }
.fb s { opacity: .75; }
.learn-top { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.round-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; width: 100%; max-width: 520px; border-top: 1px solid var(--line); }
.round-list li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.round-list .ok { color: var(--green); font-weight: 700; }
.round-list .no { color: var(--red); font-weight: 700; }

/* Test */
.tq-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.tq { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.tq.is-ok { border-color: var(--green); }
.tq.is-no { border-color: var(--red); }
.tq-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--text-2); }
.tq-prompt { font-size: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tq-prompt.term { font-family: var(--serif); font-weight: 600; font-size: 22px; }
.tq-pair { padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tq-pair .side { display: block; margin-bottom: 4px; }
.tq-verdict { font-weight: 700; }
.tq-verdict.ok { color: var(--green); }
.tq-verdict.no { color: var(--red); }
.cfg { display: flex; flex-direction: column; gap: 20px; max-width: 520px; }
.cfg .numrow { display: flex; gap: 10px; align-items: center; font-weight: 400; }
.cfg .numrow input { width: 96px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.checks label { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
.checks input { width: 17px; height: 17px; accent-color: var(--green); }

/* Match */
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mtile { min-height: 108px; padding: 12px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--panel); font-size: 15px; line-height: 1.38; overflow-wrap: anywhere; white-space: pre-wrap; display: flex; align-items: center; justify-content: center; text-align: center; transition: border-color .1s, background .1s; }
.mtile.term { font-family: var(--serif); font-weight: 600; font-size: 17px; }
.mtile:hover:not(:disabled) { border-color: var(--text-2); }
.mtile.sel { border-color: var(--green); background: var(--green-dim); }
.mtile.bad { animation: shake .3s; border-color: var(--red); }
.mtile.gone { animation: matched .4s forwards; pointer-events: none; }
@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -5px; } 75% { translate: 5px; } }
@keyframes matched { 0%, 55% { background: var(--green-dim); border-color: var(--green); opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
.penalty { color: var(--red); font: 400 14px var(--mono); align-self: center; }

/* Memory */
.memgrid { display: grid; gap: 8px; margin-inline: auto; width: 100%; }
.mcard { perspective: 1200px; aspect-ratio: 4 / 5; max-width: 100%; padding: 0; border: 0; background: none; border-radius: 6px; }
.mc-inner { position: relative; display: block; width: 100%; height: 100%; transition: transform .4s cubic-bezier(.2, .7, .2, 1); transform-style: preserve-3d; }
.mcard.up .mc-inner, .mcard.done .mc-inner { transform: rotateY(180deg); }
.mc-back, .mc-face { position: absolute; inset: 0; border-radius: 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }

let downloadsP = null;

      ? Promise.resolve(window.claude.use('downloads')).catch(() => null)

function detectSeps(text) {
  text = text.replace(/\r\n?/g, '\n');
  let lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return null;
  let card = 'newline';
  if (lines.length <= 2 && (text.match(/;/g) || []).length >= 2) {
    card = 'semicolon';
    lines = text.split(';').map(l => l.trim()).filter(Boolean);
  }
  const sample = lines.slice(0, 60);
  const share = re => sample.filter(l => re.test(l)).length / sample.length;
  let term = null;
  if (share(/\t/) >= 0.5) term = 'tab';
  else if (share(/\s[-–—]+\s/) >= 0.6) term = 'dash';
  else if (share(/:/) >= 0.6) term = 'colon';
  else if (share(/,/) >= 0.6) term = 'comma';
  return term ? { term, card } : { term: null, card };
}

/* ---------- view: editor ---------- */
function viewEdit() {
  const existing = route.setId ? Store.sets.get(route.setId) : null;
  const blank = () => ({ id: newId(), term: '', def: '' });
  const ed = {
    title: existing ? existing.title : '',
    desc: existing ? existing.description : '',
    rows: existing ? existing.cards.map(c => ({ ...c })) : [blank(), blank(), blank()],
    dirty: false,
  };
  leaveGuard = () => ed.dirty;
  const importOpen = !!route.importOpen || route.importText != null;
  app.innerHTML = `<div class="wrap narrow page">
    <button class="back" type="button" id="ed-back">${ICON.left} ${existing ? esc(existing.title) : 'Your sets'}</button>
    <h1>${existing ? 'Edit set' : 'New set'}</h1>
    <div class="stack">
      <label class="field" for="ed-title">Title<input id="ed-title" type="text" maxlength="120" placeholder="Spanish chapter 4" value="${esc(ed.title)}"></label>
      <label class="field" for="ed-desc"><span>Description <span class="muted" style="font-weight:400">(optional)</span></span><input id="ed-desc" type="text" maxlength="300" value="${esc(ed.desc)}"></label>
    </div>
    <details class="import" id="imp" ${importOpen ? 'open' : ''}>
      <summary>Import from text or a file</summary>
      <div class="import-body">
        <label class="sr" for="imp-text">Text to import</label>
        <textarea id="imp-text" spellcheck="false" placeholder="photosynthesis&#9;How plants turn light into sugar&#10;osmosis&#9;Water moving across a membrane&#10;&#10;Copy two columns from a spreadsheet, or type one card per line."></textarea>
        <div class="seps">
          <fieldset>
            <legend>Between term and definition</legend>
            <div class="chips">
              ${[['tab', 'Tab'], ['comma', 'Comma'], ['dash', 'Dash ( - )'], ['colon', 'Colon'], ['custom', 'Other']].map(([v, l], i) =>
                `<label class="chip"><input type="radio" name="tsep" id="tsep-${v}" value="${v}" ${i === 0 ? 'checked' : ''}><span>${l}</span></label>`).join('')}
              <label class="sr" for="tsep-custom-val">Other term separator</label><input type="text" class="custom-sep" id="tsep-custom-val" placeholder="e.g. =" maxlength="10">
            </div>
          </fieldset>
          <fieldset>
            <legend>Between cards</legend>
            <div class="chips">
              ${[['newline', 'New line'], ['semicolon', 'Semicolon'], ['custom', 'Other']].map(([v, l], i) =>
                `<label class="chip"><input type="radio" name="csep" id="csep-${v}" value="${v}" ${i === 0 ? 'checked' : ''}><span>${l}</span></label>`).join('')}
              <label class="sr" for="csep-custom-val">Other card separator</label><input type="text" class="custom-sep" id="csep-custom-val" placeholder="e.g. |" maxlength="10">
            </div>
          </fieldset>
        </div>
        <div class="row">
          <label class="btn filebtn" for="imp-file">Open a file (.csv, .tsv, .txt)<input type="file" id="imp-file" accept=".csv,.tsv,.txt,text/plain,text/csv,text/tab-separated-values"></label>
        </div>
        <div id="imp-preview" aria-live="polite"></div>
        <div class="row"><button class="btn primary" type="button" id="imp-add" disabled>Add cards</button></div>
      </div>
    </details>
    <div class="ed-tools">
      <h2 id="ed-count"></h2>
      <button class="btn sm" type="button" id="ed-swap">Swap terms and definitions</button>
    </div>
    <ol class="ed-rows" id="ed-rows"></ol>
    <div class="row"><button class="btn" type="button" id="ed-add">Add a card</button></div>
    <div class="ed-foot">
      <span class="err" id="ed-err" role="alert"></span>
      <button class="btn quiet" type="button" id="ed-cancel">Cancel</button>
      <button class="btn primary" type="button" id="ed-save">${existing ? 'Save changes' : 'Create set'}</button>
    </div>
  </div>`;

  const list = $('#ed-rows');
  const rowHTML = (r, i) => `<li class="ed-row" data-i="${i}">
      <span class="ed-num mono">${i + 1}</span>
      <label class="ed-field"><textarea rows="1" data-f="term" aria-label="Term ${i + 1}">${esc(r.term)}</textarea><small>Term</small></label>
      <label class="ed-field"><textarea rows="1" data-f="def" aria-label="Definition ${i + 1}">${esc(r.def)}</textarea><small>Definition</small></label>
      <button class="btn quiet icon" type="button" data-del="${i}" aria-label="Delete card ${i + 1}">${ICON.trash}</button>
    </li>`;
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  // Size every box to its text in two passes (all writes, then all reads) so long lists stay fast.
  const growAll = () => {
    const tas = [...list.querySelectorAll('textarea')];
    tas.forEach(ta => { ta.style.height = 'auto'; });
    const hs = tas.map(ta => ta.scrollHeight);
    tas.forEach((ta, i) => { ta.style.height = hs[i] + 2 + 'px'; });
  };
  const updateCount = () => {
    const n = ed.rows.filter(r => r.term.trim() || r.def.trim()).length;
    $('#ed-count').textContent = plural(n, 'card');
  };
  const drawRows = () => {
    list.innerHTML = ed.rows.map(rowHTML).join('');
    growAll();
    updateCount();
  };
  const addRow = focus => {
    ed.rows.push(blank());
    list.insertAdjacentHTML('beforeend', rowHTML(ed.rows[ed.rows.length - 1], ed.rows.length - 1));
    updateCount();
    if (focus) { const ta = list.lastElementChild.querySelector('textarea'); ta.focus(); ta.scrollIntoView({ block: 'nearest' }); }
  };
  drawRows();
  let rt = null;
  const onResize = () => { clearTimeout(rt); rt = setTimeout(growAll, 120); };
  window.addEventListener('resize', onResize);
  onCleanup(() => { window.removeEventListener('resize', onResize); clearTimeout(rt); });

  bind('#ed-title', e => { ed.title = e.target.value; ed.dirty = true; }, 'input');
  bind('#ed-desc', e => { ed.desc = e.target.value; ed.dirty = true; }, 'input');
  list.addEventListener('input', e => {
    const ta = e.target.closest('textarea'); if (!ta) return;
    const li = ta.closest('.ed-row');
    ed.rows[+li.dataset.i][ta.dataset.f] = ta.value;
    ed.dirty = true;
    li.classList.remove('err');
    grow(ta);
    updateCount();
  });
  list.addEventListener('keydown', e => {
    const ta = e.target.closest('textarea'); if (!ta) return;
    const li = ta.closest('.ed-row');
    if (e.key === 'Tab' && !e.shiftKey && ta.dataset.f === 'def' && +li.dataset.i === ed.rows.length - 1) { e.preventDefault(); addRow(true); }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    ed.rows.splice(+b.dataset.del, 1);
    if (!ed.rows.length) ed.rows.push(blank());
    ed.dirty = true;
    drawRows();
  });
  bind('#ed-add', () => addRow(true));
  bind('#ed-swap', () => {
    ed.rows.forEach(r => { const t = r.term; r.term = r.def; r.def = t; });
    ed.dirty = true;
    drawRows();
    toast('Swapped terms and definitions.');
  });

  // Import panel
  const impText = $('#imp-text'), preview = $('#imp-preview'), addBtn = $('#imp-add');
  let parsed = { cards: [], skipped: 0 };
  const radio = name => (app.querySelector(`input[name="${name}"]:checked`) || {}).value;
  const currentSeps = () => {
    const t = radio('tsep'), c = radio('csep');
    const term = t === 'custom' ? ($('#tsep-custom-val').value || null) : TERM_SEPS[t];
    const card = c === 'custom' ? ($('#csep-custom-val').value || '\n') : CARD_SEPS[c];
    return { term, card };
  };
  const updatePreview = () => {
    const text = impText.value;
    if (!text.trim()) {
      parsed = { cards: [], skipped: 0 };
      preview.innerHTML = `<p class="muted">Paste your list above and the cards it finds will show up here.</p>`;
      addBtn.disabled = true; addBtn.textContent = 'Add cards';
      return;
    }
    const s = currentSeps();
    if (!s.term) {
      parsed = { cards: [], skipped: 0 };
      preview.innerHTML = `<p class="err">Type the character that goes between each term and its definition.</p>`;
      addBtn.disabled = true; addBtn.textContent = 'Add cards';
      return;
    }
    parsed = parseImport(text, s.term, s.card);
    const n = parsed.cards.length;
    const sk = parsed.skipped ? ` <span class="muted">(${plural(parsed.skipped, 'line')} skipped, no separator found)</span>` : '';
    preview.innerHTML = n
      ? `<p><strong>Found ${plural(n, 'card')}</strong>${sk}</p>
         <div class="imp-table-wrap"><table class="imp-table"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
         ${parsed.cards.slice(0, 6).map(c => `<tr><td>${esc(c.term)}</td><td>${esc(c.def)}</td></tr>`).join('')}
         </tbody></table></div>${n > 6 ? `<p class="muted">and ${n - 6} more</p>` : ''}`
      : `<p class="err">No cards found. Pick the separator your list uses between each term and its definition.</p>${sk ? `<p class="muted">${plural(parsed.skipped, 'line')} had no separator.</p>` : ''}`;
    addBtn.disabled = !n;
    addBtn.textContent = n ? `Add ${plural(n, 'card')}` : 'Add cards';
  };
  const applyDetect = () => {
    const d = detectSeps(impText.value);
    if (!d) return;
    if (d.term) { const r = app.querySelector(`#tsep-${d.term}`); if (r) r.checked = true; }
    const rc = app.querySelector(`#csep-${d.card}`); if (rc) rc.checked = true;
  };
  const loadText = (text, name) => {
    impText.value = text;
    if (name && /\.csv$/i.test(name) && !text.includes('\t')) { $('#tsep-comma').checked = true; $('#csep-newline').checked = true; }
    else applyDetect();
    updatePreview();
  };
  let pt = null;
  impText.addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(updatePreview, 150); });
  impText.addEventListener('paste', () => setTimeout(() => { applyDetect(); updatePreview(); }, 0));
  app.querySelectorAll('input[name="tsep"], input[name="csep"]').forEach(r => r.addEventListener('change', updatePreview));
  ['#tsep-custom-val', '#csep-custom-val'].forEach(sel => bind(sel, e => {
    const which = sel.startsWith('#tsep') ? '#tsep-custom' : '#csep-custom';
    if (e.target.value) $(which).checked = true;
    updatePreview();
  }, 'input'));
  bind('#imp-file', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    readFile(f, text => loadText(text, f.name), msg => { preview.innerHTML = `<p class="err">${esc(msg)}</p>`; });
    e.target.value = '';
  }, 'change');
  bind('#imp-add', () => {
    if (!parsed.cards.length) return;
    while (ed.rows.length && !ed.rows[ed.rows.length - 1].term.trim() && !ed.rows[ed.rows.length - 1].def.trim()) ed.rows.pop();
    const room = 2000 - ed.rows.length;
    const add = parsed.cards.slice(0, Math.max(0, room));
    add.forEach(c => ed.rows.push({ id: newId(), term: c.term, def: c.def }));
    if (!ed.rows.length) ed.rows.push(blank());
    ed.dirty = true;
    drawRows();
    impText.value = '';
    updatePreview();
    $('#imp').open = false;
    toast(add.length < parsed.cards.length
      ? `Added ${plural(add.length, 'card')}. A set holds up to 2,000 cards, so the rest were left out.`
      : `Added ${plural(add.length, 'card')}. Check them below, then save.`);
    $('#ed-count').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  if (route.importText != null) loadText(route.importText, route.importName);
  else updatePreview();

  const leave = () => navigate(existing ? { view: 'set', setId: existing.id } : { view: 'library' });
  bind('#ed-back', leave);
  bind('#ed-cancel', leave);
  bind('#ed-save', () => {
    const errEl = $('#ed-err');
    errEl.textContent = '';
    list.querySelectorAll('.ed-row.err').forEach(li => li.classList.remove('err'));
    const bad = [];
    const cards = [];
    ed.rows.forEach((r, i) => {
      const t = r.term.trim(), d = r.def.trim();
      if (!t && !d) return;
      if (!t || !d) { bad.push(i); return; }
      cards.push({ id: r.id, term: t, def: d });
    });
    if (bad.length) {
      bad.forEach(i => { const li = list.querySelector(`[data-i="${i}"]`); if (li) li.classList.add('err'); });
      errEl.textContent = bad.length === 1 ? `Card ${bad[0] + 1} is missing a side. Fill it in or delete it.` : `${bad.length} cards are missing a side. Fill them in or delete them.`;
      const first = list.querySelector('.ed-row.err');
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    if (cards.length < 2) { errEl.textContent = 'A set needs at least two cards.'; return; }
    const set = existing ? plain(existing) : normalizeSet({ cards: [] });
    set.title = ed.title.trim() || 'Untitled set';
    set.description = ed.desc.trim();
    set.cards = cards;
    const keep = new Set(cards.map(c => c.id));
    Object.keys(set.progress).forEach(id => { if (!keep.has(id)) delete set.progress[id]; });
    if (byteSize(set) > MAX_BYTES) { errEl.textContent = 'This set is too large to save. Split it into two smaller sets.'; return; }
    ed.dirty = false;
    persist(set);
    go({ view: 'set', setId: set.id });
    toast(existing ? 'Saved.' : `Created “${set.title}”.`);
  });
  if (importOpen) setTimeout(() => impText.focus(), 50);
}

/* ---------- view: flashcards ---------- */
const canSpeak = (() => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; } catch (e) { return false; } })();
function speak(text) { try { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); } catch (e) { /* ignore */ } }
function viewFlashcards(set) {
  const base = studyCards(set);
  const S = { order: base.map(c => c.id), i: 0, flipped: false, know: new Set(), learn: new Set(), shuffled: false, done: false };
  const byId = id => set.cards.find(c => c.id === id);
  app.innerHTML = `<div class="wrap page">${modeHeader(set, 'Flashcards')}<div class="stack" id="fc-root"></div></div>`;
  const root = $('#fc-root');
  const face = (c, side, which) => `<div class="fc-face card ${which}"><span class="side">${sideLabel(side)}</span><div class="fc-text ${side} ${sizeClass(c[side])}"><span>${esc(c[side])}</span></div></div>`;

  function draw() {
    if (S.done) return drawDone();
    const c = byId(S.order[S.i]);
    const front = prefs.fcFront === 'def' ? 'def' : 'term';
    const starred = !!prog(set, c.id).s;
    root.innerHTML = `
      <div class="fc-bar">
        <span class="mono muted">${S.i + 1} of ${S.order.length}</span>
        <div class="row tight">
          <button class="btn sm ${S.shuffled ? 'on' : ''}" type="button" id="fc-shuffle" aria-pressed="${S.shuffled}">Shuffle</button>
          <button class="btn sm" type="button" id="fc-side">Show ${front === 'term' ? 'definitions' : 'terms'} first</button>
          ${canSpeak ? `<button class="btn sm icon" type="button" id="fc-speak" aria-label="Read the visible side aloud">${ICON.speak}</button>` : ''}
          <button class="btn sm icon star ${starred ? 'on' : ''}" type="button" id="fc-star" aria-pressed="${starred}" aria-label="Star this card">${starred ? ICON.starOn : ICON.star}</button>
        </div>
      </div>
      <div class="fc-progress"><span style="width:${(S.i / S.order.length) * 100}%"></span></div>
      <div class="fc-stage">
        <div class="flashcard" id="fc" role="button" tabindex="0" data-keyok aria-label="Card ${S.i + 1}. Press to flip.">
          <div class="fc-inner">${face(c, front, 'front')}${face(c, other(front), 'back')}</div>
        </div>
      </div>
      <div class="fc-actions">
        <button class="btn icon" type="button" id="fc-prev" aria-label="Previous card" ${S.i === 0 ? 'disabled' : ''}>${ICON.left}</button>
        <button class="btn learnbtn" type="button" id="fc-learn">Still learning <kbd>1</kbd></button>
        <button class="btn knowbtn" type="button" id="fc-know">Got it <kbd>2</kbd></button>
        <button class="btn icon" type="button" id="fc-next" aria-label="Skip to next card">${ICON.right}</button>
      </div>
      <p class="hint" style="text-align:center">Click the card or press space to flip it. Arrow keys move between cards.</p>`;
    S.flipped = false;
    $('#fc').addEventListener('click', flip);
    bind('#fc-prev', () => move(-1));
    bind('#fc-next', () => move(1));
    bind('#fc-learn', () => mark('learn'));
    bind('#fc-know', () => mark('know'));
    bind('#fc-shuffle', toggleShuffle);
    bind('#fc-side', () => { prefs.fcFront = front === 'term' ? 'def' : 'term'; savePrefs(); draw(); });
    bind('#fc-speak', () => speak(S.flipped ? c[other(front)] : c[front]));
    bind('#fc-star', e => {
      const on = toggleStar(set, c.id);
      const b = e.currentTarget;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.innerHTML = on ? ICON.starOn : ICON.star;
    });
  }
  function flip() {
    S.flipped = !S.flipped;
    const card = $('#fc');
    if (card) card.classList.toggle('flipped', S.flipped);
  }
  function move(d) {
    const ni = S.i + d;
    if (ni < 0) return;
    if (ni >= S.order.length) { S.done = true; draw(); return; }
    S.i = ni; draw();
  }
  function mark(kind) {
    const id = S.order[S.i];
    S.know.delete(id); S.learn.delete(id);
    S[kind].add(id);
    move(1);
  }
  function toggleShuffle() {
    S.shuffled = !S.shuffled;
    const head = S.order.slice(0, S.i + 1), rest = S.order.slice(S.i + 1);
    const idx = new Map(base.map((c, i) => [c.id, i]));
    S.order = head.concat(S.shuffled ? shuffle(rest) : rest.sort((a, b) => idx.get(a) - idx.get(b)));
    draw();
  }
  function restart(ids) {
    S.order = S.shuffled ? shuffle(ids) : ids;
    S.i = 0; S.done = false; S.know = new Set(); S.learn = new Set();
    draw();
  }
  function drawDone() {
    const k = S.know.size, l = S.learn.size, total = S.order.length;
    const learnIds = S.order.filter(id => S.learn.has(id));
    const skipped = total - k - l;
    root.innerHTML = `<div class="result">
      <h2>${k === total ? 'You knew every card.' : 'End of the deck'}</h2>
      <div class="bignum">${k}/${total}</div>
      <p class="muted">${k} marked “got it”, ${l} still learning${skipped ? `, ${skipped} skipped` : ''}.</p>
      <div class="row">
        ${learnIds.length ? `<button class="btn primary" type="button" id="fc-review">Go through the ${plural(learnIds.length, 'card')} you’re still learning</button>` : ''}
        <button class="btn ${learnIds.length ? '' : 'primary'}" type="button" id="fc-restart">Start over</button>
        <button class="btn" type="button" data-back>Back to set</button>
      </div></div>`;
    bind('#fc-review', () => restart(learnIds));
    bind('#fc-restart', () => restart(base.map(c => c.id)));
  }
  keyHandler = e => {
    if (isTyping(e.target) || S.done) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); move(-1); }
    else if (e.key === '1') mark('learn');
    else if (e.key === '2') mark('know');
  };
  draw();
}

/* ---------- view: learn ---------- */
function viewLearn(set) {
  const S = { round: [], qi: 0, results: [], cur: null, phase: 'q' };
  app.innerHTML = `<div class="wrap narrow page">
    ${modeHeader(set, 'Learn', `<label class="toggle" for="ans-with">Answer with <select id="ans-with"><option value="term">the term</option><option value="def">the definition</option></select></label>`)}
    <div class="learn-top"><div class="mbar big" id="ln-bar" role="img"></div><span class="mono muted small" id="ln-count"></span></div>
    <div class="stack" id="ln-root"></div>
  </div>`;
  const root = $('#ln-root');
  const sel = $('#ans-with');
  sel.value = prefs.answerWith;
  sel.addEventListener('change', () => { prefs.answerWith = sel.value; savePrefs(); if (S.phase === 'q' && S.cur) ask(); });
  const pool = () => studyCards(set).filter(c => (prog(set, c.id).l || 0) < 2);
  function drawTop() {
    const cards = studyCards(set), c = counts(set, cards);
    const pct = v => (c.total ? (v / c.total) * 100 : 0).toFixed(1);
    $('#ln-bar').innerHTML = `<span class="m-done" style="width:${pct(c.m)}%"></span><span class="m-learn" style="width:${pct(c.l)}%"></span>`;
    $('#ln-bar').setAttribute('aria-label', `${c.m} of ${c.total} mastered`);
    $('#ln-count').textContent = `${c.m} of ${c.total} mastered`;
  }
  function startRound() {
    const p = shuffle(pool());
    drawTop();
    if (!p.length) return drawDone();
    S.round = p.slice(0, 7); S.qi = 0; S.results = [];
    ask();
  }
  function ask() {
    const c = S.round[S.qi];
    const lvl = prog(set, c.id).l || 0;
    const { p, a } = sides(prefs.answerWith);
    const opts = mcOptions(c, a, set.cards);
    const type = lvl === 0 && opts.length >= 2 ? 'mc' : 'write';
    S.cur = { c, lvl, type, opts, p, a, answered: false };
    S.phase = 'q';
    root.innerHTML = `
      <div class="qcard card">
        <span class="side">${sideLabel(p)}</span>
        <div class="qprompt ${p} ${sizeClass(c[p])}">${esc(c[p])}</div>
      </div>
      ${type === 'mc' ? `
        <p class="qhint">Which ${a === 'term' ? 'term' : 'definition'} goes with this?</p>
        <div class="choices">${opts.map((o, i) => `<button class="choice" type="button" data-i="${i}"><span class="k">${i + 1}</span><span class="ct">${esc(o)}</span></button>`).join('')}</div>
        <div><button class="link" type="button" id="dk">I don’t know</button></div>` : `
        <form class="wform" id="wform" autocomplete="off">
          <label class="qhint" for="winput">Type the ${a === 'term' ? 'term' : 'definition'}</label>
          <div class="row"><input id="winput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="btn primary" type="submit">Check</button></div>
          <div><button class="link" type="button" id="dk">I don’t know</button></div>
        </form>`}
      <div id="fb"></div>`;
    if (type === 'mc') {
      root.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => pickMC(+b.dataset.i)));
    } else {
      const inp = $('#winput');
      inp.focus();
      $('#wform').addEventListener('submit', e => {
        e.preventDefault();
        if (S.cur.answered) return;
        if (!inp.value.trim()) { inp.focus(); return; }
        const g = grade(inp.value, c[a]);
        result(g.ok, inp.value, g.note);
      });
    }
    bind('#dk', () => { if (!S.cur.answered) result(false, '', null); });
  }
  function pickMC(i) {
    if (S.cur.answered) return;
    const { c, a, opts } = S.cur;
    const ok = key(opts[i]) === key(c[a]);
    root.querySelectorAll('.choice').forEach((b, j) => {
      b.disabled = true;
      if (key(opts[j]) === key(c[a])) b.classList.add('correct');
      else if (j === i) b.classList.add('wrong');
    });
    result(ok, opts[i], null);
  }
  const PRAISE = ['Right.', 'Correct.', 'That’s it.', 'Yep.', 'Nice.'];
  function result(ok, given, note) {
    const cur = S.cur;
    cur.answered = true;
    S.phase = 'fb';
    setLevel(set, cur.c.id, ok ? Math.min(2, cur.lvl + 1) : 0);
    persist(set, 800);
    S.results.push({ c: cur.c, ok });
    drawTop();
    const inp = $('#winput'); if (inp) inp.disabled = true;
    root.querySelectorAll('#wform button, #dk').forEach(b => { b.disabled = true; });
    const fb = $('#fb');
    if (ok) {
      const lvlMsg = cur.lvl + 1 >= 2 ? 'That card is mastered.' : 'Next time you’ll type it.';
      fb.innerHTML = `<div class="fb good"><strong>${PRAISE[Math.floor(Math.random() * PRAISE.length)]}</strong>
        ${note ? `<span class="ans">${esc(note)}</span>` : ''}<span class="muted">${lvlMsg}</span>
        <div><button class="btn primary" type="button" id="cont">Continue <kbd>Enter</kbd></button></div></div>`;
      if (!note) later(() => { if (S.phase === 'fb' && S.cur === cur) next(); }, cur.type === 'mc' ? 900 : 1200);
    } else {
      fb.innerHTML = `<div class="fb bad"><strong>${given ? 'Not quite.' : 'Here’s the answer.'}</strong>
        ${given && cur.type === 'write' ? `<span class="ans">You wrote <s>${esc(given)}</s></span>` : ''}
        <span class="ans">The answer is <b>${esc(cur.c[cur.a])}</b></span>
        <div class="row"><button class="btn primary" type="button" id="cont">Continue <kbd>Enter</kbd></button>
        ${given && cur.type === 'write' ? '<button class="btn" type="button" id="override">Count it, I was right</button>' : ''}</div></div>`;
      bind('#override', () => {
        if (S.phase !== 'fb' || S.cur !== cur) return;
        setLevel(set, cur.c.id, Math.min(2, cur.lvl + 1));
        persist(set, 800);
        S.results[S.results.length - 1].ok = true;
        next();
      });
    }
    bind('#cont', next);
    const cont = $('#cont'); if (cont) cont.focus();
  }
  function next() {
    if (S.phase !== 'fb') return;
    S.phase = 'moving';
    S.qi++;
    if (S.qi >= S.round.length) drawSummary(); else ask();
  }
  function drawSummary() {
    S.phase = 'summary';
    drawTop();
    const ok = S.results.filter(r => r.ok).length;
    const { a } = sides(prefs.answerWith);
    root.innerHTML = `<div class="result">
      <h2>Round done: ${ok} of ${S.results.length} right</h2>
      <ul class="round-list">${S.results.map(r => `<li><span class="${r.ok ? 'ok' : 'no'}" aria-label="${r.ok ? 'right' : 'wrong'}">${r.ok ? '✓' : '✗'}</span><span>${esc(r.c[a])}</span></li>`).join('')}</ul>
      <div class="row"><button class="btn primary" type="button" id="next-round">Next round <kbd>Enter</kbd></button><button class="btn" type="button" data-back>Back to set</button></div>
    </div>`;
    bind('#next-round', startRound);
    $('#next-round').focus();
  }
  function drawDone() {
    S.phase = 'done';
    const starOnly = prefs.starredOnly[set.id] && set.cards.some(c => prog(set, c.id).s);
    root.innerHTML = `<div class="result">
      <h2>Every ${starOnly ? 'starred ' : ''}card is mastered.</h2>
      <p class="muted">See if it sticks with a practice test, or reset and go through the set again.</p>
      <div class="row">
        <button class="btn primary" type="button" id="to-test">Take a practice test</button>
        <button class="btn" type="button" id="relearn">Reset and start over</button>
        <button class="btn" type="button" data-back>Back to set</button>
      </div></div>`;
    bind('#to-test', () => go({ view: 'test', setId: set.id }));
    bind('#relearn', () => {
      studyCards(set).forEach(c => setLevel(set, c.id, 0));
      persist(set);
      startRound();
    });
  }
  keyHandler = e => {
    if (S.phase === 'q' && S.cur && S.cur.type === 'mc' && !isTyping(e.target)) {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= S.cur.opts.length) { e.preventDefault(); pickMC(n - 1); }
    } else if (e.key === 'Enter') {
      if (S.phase === 'fb') { e.preventDefault(); next(); }
      else if (S.phase === 'summary') { e.preventDefault(); startRound(); }
    }
  };
  startRound();
}

/* ---------- view: practice test ---------- */
function viewTest(set) {
  const cards = studyCards(set);
  const cfg = { n: Math.min(cards.length, 20), types: { mc: true, tf: true, write: true }, ans: prefs.answerWith };
  let qs = [];
  app.innerHTML = `<div class="wrap narrow page">${modeHeader(set, 'Practice test')}<div id="t-root" class="stack"></div></div>`;
  const root = $('#t-root');
  const TYPE_LABEL = { mc: 'Multiple choice', tf: 'True or false', write: 'Written' };

  function drawConfig() {
    root.innerHTML = `<div class="cfg">
      <label class="field" for="t-n">How many questions?
        <span class="numrow"><input id="t-n" type="number" min="1" max="${cards.length}" value="${cfg.n}"><span class="muted">out of ${cards.length}</span></span>
      </label>
      <fieldset><legend>Question types</legend><div class="checks">
        ${Object.keys(TYPE_LABEL).map(t => `<label for="t-${t}"><input type="checkbox" id="t-${t}" ${cfg.types[t] ? 'checked' : ''}> ${TYPE_LABEL[t]}</label>`).join('')}
      </div></fieldset>
      <label class="toggle" for="t-ans">Answer with <select id="t-ans"><option value="term">the term</option><option value="def">the definition</option></select></label>
      <p class="err" id="t-err" role="alert"></p>
      <div><button class="btn primary big" type="button" id="t-start">Start the test</button></div>
    </div>`;
    $('#t-ans').value = cfg.ans;
    bind('#t-start', () => {
      const n = Math.round(Number($('#t-n').value));
      Object.keys(TYPE_LABEL).forEach(t => { cfg.types[t] = $('#t-' + t).checked; });
      cfg.ans = $('#t-ans').value;
      const types = Object.keys(TYPE_LABEL).filter(t => cfg.types[t]);
      if (!types.length) { $('#t-err').textContent = 'Pick at least one question type.'; return; }
      if (!n || n < 1 || n > cards.length) { $('#t-err').textContent = `Choose a number from 1 to ${cards.length}.`; return; }
      cfg.n = n;
      prefs.answerWith = cfg.ans; savePrefs();
      build(types);
    });
  }
  function build(types) {
    const { p, a } = sides(cfg.ans);
    const picked = shuffle(cards).slice(0, cfg.n);
    qs = shuffle(picked.map((c, i) => {
      let type = types[i % types.length];
      if (type === 'mc') {
        const opts = mcOptions(c, a, set.cards);
        if (opts.length >= 2) return { type, c, p, a, opts, user: null };
        type = 'write';
      }
      if (type === 'tf') {
        const dist = shuffle(set.cards).find(d => key(d[a]) !== key(c[a]));
        const truth = !dist || Math.random() < 0.5;
        return { type, c, p, a, shown: truth ? c[a] : dist[a], truth, user: null };
      }
      return { type: 'write', c, p, a, user: '' };
    }));
    drawTest();
  }
  function qBody(q, i, graded) {
    const head = `<div class="tq-head"><span>Question ${i + 1} of ${qs.length}</span><span>${TYPE_LABEL[q.type]}</span></div>
      <div class="tq-prompt ${q.p}">${esc(q.c[q.p])}</div>`;
    if (q.type === 'mc') {
      return head + `<div class="choices">${q.opts.map((o, j) => {
        let cls = q.user === j ? 'picked' : '';
        if (graded) cls = key(o) === key(q.c[q.a]) ? 'correct' : (q.user === j ? 'wrong' : '');
        return `<button class="choice ${cls}" type="button" data-q="${i}" data-o="${j}" ${graded ? 'disabled' : ''} aria-pressed="${q.user === j}"><span class="k">${String.fromCharCode(65 + j)}</span><span class="ct">${esc(o)}</span></button>`;
      }).join('')}</div>`;
    }
    if (q.type === 'tf') {
      const btn = (v, label) => {
        let cls = q.user === v ? 'picked' : '';
        if (graded) cls = q.truth === v ? 'correct' : (q.user === v ? 'wrong' : '');
        return `<button class="choice ${cls}" type="button" data-q="${i}" data-tf="${v ? 1 : 0}" ${graded ? 'disabled' : ''} aria-pressed="${q.user === v}"><span class="ct">${label}</span></button>`;
      };
      return head + `<div class="tq-pair"><span class="side">Is this the right ${q.a === 'term' ? 'term' : 'definition'}?</span>${esc(q.shown)}</div>
        <div class="choices">${btn(true, 'True')}${btn(false, 'False')}</div>`;
    }
    return head + `<label class="sr" for="tw-${i}">Your answer to question ${i + 1}</label><input type="text" id="tw-${i}" data-q="${i}" class="tq-input" placeholder="Type the ${q.a === 'term' ? 'term' : 'definition'}" value="${esc(q.user)}" ${graded ? 'disabled' : ''} autocomplete="off" autocapitalize="off" spellcheck="false">`;
  }
  function drawTest() {
    root.innerHTML = `<ol class="tq-list">${qs.map((q, i) => `<li class="tq" id="tq-${i}">${qBody(q, i, false)}</li>`).join('')}</ol>
      <div class="row" style="justify-content:space-between">
        <span class="muted" id="t-left"></span>
        <button class="btn primary big" type="button" id="t-submit">Submit answers</button>
      </div>`;
    const list = root.querySelector('.tq-list');
    const left = () => { const n = qs.filter(q => q.type === 'write' ? !q.user.trim() : q.user === null).length; $('#t-left').textContent = n ? `${plural(n, 'question')} left` : 'All questions answered'; };
    list.addEventListener('click', e => {
      const b = e.target.closest('[data-q]'); if (!b || b.tagName === 'INPUT') return;
      const i = +b.dataset.q, q = qs[i];
      let sel;
      if (b.dataset.o != null) { q.user = +b.dataset.o; sel = `[data-o="${b.dataset.o}"]`; }
      else if (b.dataset.tf != null) { q.user = b.dataset.tf === '1'; sel = `[data-tf="${b.dataset.tf}"]`; }
      const li = $('#tq-' + i);
      li.innerHTML = qBody(q, i, false);
      // Keep keyboard focus on the answer that was just picked.
      const again = li.querySelector(sel); if (again) again.focus();
      left();
    });
    list.addEventListener('input', e => {
      const inp = e.target.closest('input[data-q]'); if (!inp) return;
      qs[+inp.dataset.q].user = inp.value;
      left();
    });
    list.addEventListener('keydown', e => {
      const inp = e.target.closest('input[data-q]');
      if (inp && e.key === 'Enter') {
        e.preventDefault();
        const nextLi = $('#tq-' + (+inp.dataset.q + 1));
        const target = nextLi ? nextLi.querySelector('input, button') : $('#t-submit');
        if (target) target.focus();
      }
    });
    left();
    bind('#t-submit', submit);
  }
  function submit() {
    let right = 0;
    qs.forEach(q => {
      if (q.type === 'mc') q.ok = q.user !== null && key(q.opts[q.user]) === key(q.c[q.a]);
      else if (q.type === 'tf') q.ok = q.user !== null && q.user === q.truth;
      else { const g = grade(q.user, q.c[q.a]); q.ok = g.ok; q.note = g.note; }
      if (q.ok) right++;
    });
    const pctScore = Math.round((right / qs.length) * 100);
    const msg = pctScore === 100 ? 'A perfect score.' : pctScore >= 80 ? 'Solid result.' : pctScore >= 50 ? 'Getting there.' : 'Keep at it. Learn mode is good for the ones you missed.';
    root.innerHTML = `<div class="result">
        <h2>${msg}</h2>
        <div class="bignum">${pctScore}%</div>
        <p class="muted">${right} of ${qs.length} correct. Your answers are marked below.</p>
        <div class="row"><button class="btn primary" type="button" id="t-retake">New test, same settings</button><button class="btn" type="button" id="t-settings">Change settings</button><button class="btn" type="button" data-back>Back to set</button></div>
      </div>
      <ol class="tq-list">${qs.map((q, i) => {
        const unanswered = q.type === 'write' ? !q.user.trim() : q.user === null;
        const tfAnswer = q.truth ? 'True' : `False. It’s “${q.c[q.a]}”`;
        return `<li class="tq ${q.ok ? 'is-ok' : 'is-no'}">${qBody(q, i, true)}
        <p class="tq-verdict ${q.ok ? 'ok' : 'no'}">${q.ok ? 'Correct' : unanswered ? 'Not answered' : 'Incorrect'}</p>
        ${q.note ? `<p class="muted">${esc(q.note)}</p>` : ''}
        ${!q.ok && q.type !== 'mc' ? `<p>Answer: <b>${esc(q.type === 'tf' ? tfAnswer : q.c[q.a])}</b></p>` : ''}
      </li>`;
      }).join('')}</ol>`;
    bind('#t-retake', () => build(Object.keys(TYPE_LABEL).filter(t => cfg.types[t])));
    bind('#t-settings', drawConfig);
    window.scrollTo(0, 0);
  }
  drawConfig();
}

/* ---------- view: match ---------- */
function viewMatch(set) {
  const cards = studyCards(set);
  const pairs = matchPairs(cards);
  app.innerHTML = `<div class="wrap page">${modeHeader(set, 'Match', `<span class="penalty" id="m-pen"></span>${stat('m-time', 'time', '0.0s')}`)}<div id="m-root" class="stack"></div></div>`;
  const root = $('#m-root');
  let stopTimer = null;
  function intro() {
    const b = bestOf(set, 'match', String(pairs));
    root.innerHTML = introBlock({
      title: `${pairs} pairs`,
      how: 'Click a term, then click its definition. Matched pairs drop off the board. Each wrong pair adds a second to your time.',
      best: b != null ? fmtTime(b) : '',
      start: 'Start the clock',
    });
    bind('#again', play);
  }
  function play() {
    const pick = uniqueCards(shuffle(cards)).slice(0, pairs);
    const tiles = shuffle(pick.flatMap(c => [{ id: c.id, side: 'term', text: c.term }, { id: c.id, side: 'def', text: c.def }]));
    const S = { sel: null, left: pick.length, penalty: 0, t0: performance.now() };
    root.innerHTML = `<div class="mgrid">${tiles.map((t, i) => `<button class="mtile ${t.side}" type="button" data-i="${i}">${esc(t.text)}</button>`).join('')}</div>`;
    const timeEl = $('#m-time'), penEl = $('#m-pen');
    penEl.textContent = '';
    stopTimer = loop(now => { timeEl.textContent = fmtTime(now - S.t0 + S.penalty); });
    const tileEl = i => root.querySelector(`[data-i="${i}"]`);
    root.querySelector('.mgrid').addEventListener('click', e => {
      const b = e.target.closest('.mtile');
      if (!b || b.disabled) return;
      const i = +b.dataset.i;
      if (S.sel === null) { S.sel = i; b.classList.add('sel'); return; }
      if (S.sel === i) { b.classList.remove('sel'); S.sel = null; return; }
      const a = tiles[S.sel], t = tiles[i], ab = tileEl(S.sel);
      ab.classList.remove('sel');
      if (a.side === t.side) { S.sel = i; b.classList.add('sel'); return; }
      S.sel = null;
      if (a.id === t.id) {
        [ab, b].forEach(x => { x.disabled = true; x.classList.add('gone'); });
        if (--S.left === 0) finish(performance.now() - S.t0 + S.penalty);
      } else {
        S.penalty += 1000;
        penEl.textContent = '+' + S.penalty / 1000 + 's penalty';
        [ab, b].forEach(x => { x.classList.remove('bad'); void x.offsetWidth; x.classList.add('bad'); });
      }
    });
  }
  function finish(ms) {
    if (stopTimer) stopTimer();
    ms = Math.round(ms);
    $('#m-time').textContent = fmtTime(ms);
    const r = recordBest(set, 'match', String(pairs), ms, true);
    later(() => {
      root.innerHTML = resultBlock({ title: 'Board cleared', big: fmtTime(ms), isNew: r.isNew && r.hadPrev, sub: r.isNew ? (r.hadPrev ? '' : 'That’s your first time on the board for this set.') : `Your best is ${fmtTime(r.best)}.` });
      bind('#again', play);
    }, 450);
  }
  intro();
}

/* ---------- view: memory flip ---------- */
function viewMemory(set) {
  const cards = studyCards(set);
  const pairs = memoryPairs(cards);
  app.innerHTML = `<div class="wrap page">${modeHeader(set, 'Memory Flip', `${stat('mm-moves', 'moves')}${stat('mm-time', 'time', '0.0s')}`)}<div id="mm-root" class="stack"></div></div>`;
  const root = $('#mm-root');
  function intro() {
    const b = bestOf(set, 'memory', String(pairs));
    root.innerHTML = introBlock({
      title: `${pairs} pairs, face down`,
      how: `Turn over two cards per move. When a term and its definition come up together, they stay face up. The fewest possible moves is ${pairs}.`,
      best: b != null ? plural(b, 'move') : '',
      start: 'Deal the cards',
    });
    bind('#again', play);
  }
  function play() {
    const pick = uniqueCards(shuffle(cards)).slice(0, pairs);
    const deck = shuffle(pick.flatMap(c => [{ id: c.id, side: 'term', text: c.term }, { id: c.id, side: 'def', text: c.def }]));
    const cols = { 4: 2, 6: 3, 8: 4, 12: 4, 16: 4 }[deck.length] || 4;
    const S = { up: [], moves: 0, found: 0, lock: false, t0: null, over: false };
    root.innerHTML = `<div class="memgrid" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr)); max-width:${cols * 170}px">
      ${deck.map((d, i) => `<button class="mcard" type="button" data-i="${i}" aria-label="Card ${i + 1}, face down"><span class="mc-inner"><span class="mc-back"></span><span class="mc-face"><span class="side">${sideLabel(d.side)}</span><span class="mc-text ${d.side}">${esc(d.text)}</span></span></span></button>`).join('')}
    </div>`;
    const movesEl = $('#mm-moves'), timeEl = $('#mm-time');
    movesEl.textContent = '0'; timeEl.textContent = '0.0s';
    const stop = loop(now => { if (S.t0 !== null && !S.over) timeEl.textContent = fmtTime(now - S.t0); });
    const el = i => root.querySelector(`[data-i="${i}"]`);
    const setUp = (i, up) => { const b = el(i); b.classList.toggle('up', up); b.setAttribute('aria-label', up ? `${sideLabel(deck[i].side)}: ${deck[i].text}` : `Card ${i + 1}, face down`); };
    root.querySelector('.memgrid').addEventListener('click', e => {
      const b = e.target.closest('.mcard'); if (!b) return;
      const i = +b.dataset.i;
      if (S.lock || S.over || b.classList.contains('done') || S.up.includes(i)) return;
      if (S.t0 === null) S.t0 = performance.now();
      setUp(i, true);
      S.up.push(i);
      if (S.up.length < 2) return;
      S.moves++;
      movesEl.textContent = S.moves;
      const [x, y] = S.up;
      if (deck[x].id === deck[y].id) {
        [x, y].forEach(k => { el(k).classList.add('done'); el(k).classList.remove('up'); });
        S.up = [];
        if (++S.found === pairs) {
          S.over = true; stop();
          const ms = performance.now() - S.t0;
          timeEl.textContent = fmtTime(ms);
          const r = recordBest(set, 'memory', String(pairs), S.moves, true);
          later(() => {
            root.innerHTML = resultBlock({ title: 'All pairs found', big: plural(S.moves, 'move'), isNew: r.isNew && r.hadPrev, sub: `Took ${fmtTime(ms)}. A perfect game is ${pairs} moves.${r.isNew ? '' : ` Your best is ${plural(r.best, 'move')}.`}` });
            bind('#again', play);
          }, 700);
        }
      } else {
        S.lock = true;
        later(() => { setUp(x, false); setUp(y, false); S.up = []; S.lock = false; }, 950);
      }
    });
  }
  intro();
}

/* ---------- view: bubble pop ---------- */

  };
  function intro() {

    root.innerHTML = introBlock({
      title: 'Pop the right answer',
      how: `A ${gs.clue === 'term' ? 'term' : 'definition'} shows up at the top and ${gs.show === 'term' ? 'terms' : 'definitions'} float up from below. Pop the one that matches before it drifts off the top. A wrong pop or a miss costs one of your three lives, and the bubbles speed up as you go. Number keys 1 to 4 pop bubbles too.`,
      best: b != null ? b + ' pts' : '',
      start: 'Start',
    });
    bind('#again', play);
  }
  function play() {
    S = { lives: 3, score: 0, streak: 0, dur: 8.5, wave: null, last: null, over: false };
    root.innerHTML = `<div class="b-prompt card"><span class="side">${sideLabel(gs.clue)}</span><div class="qprompt ${gs.clue}" id="b-clue"></div><div class="b-reveal" id="b-reveal" aria-live="polite"></div></div><div class="arena" id="arena"></div>`;
    hud();
    nextWave();
    loop((now, dt) => step(dt));
  }
  function nextWave() {
    if (S.over) return;
    const arena = $('#arena');
    arena.innerHTML = '';
    $('#b-reveal').textContent = '';
    let target = cards[Math.floor(Math.random() * cards.length)];
    if (cards.length > 1) while (target.id === S.last) target = cards[Math.floor(Math.random() * cards.length)];
    S.last = target.id;
    const opts = shuffle([target, ...shuffle(cards.filter(c => c.id !== target.id)).slice(0, 3)]);
    $('#b-clue').textContent = target[gs.clue];
    const W = arena.clientWidth, H = arena.clientHeight;
    const laneW = W / opts.length;
    const bw = Math.min(laneW - 10, 230);
    const bubbles = opts.map((c, i) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'bubble';
      el.innerHTML = `<span class="bnum">${i + 1}</span><span>${esc(c[gs.show])}</span>`;
      el.style.width = bw + 'px';
      el.style.left = (i * laneW + (laneW - bw) / 2) + 'px';
      arena.appendChild(el);
      const h = el.offsetHeight;
      el.style.transform = `translate(0px, ${h + 16}px)`;
      const b = { el, c, h, y: -h - 16, delay: i * 0.25 + Math.random() * 0.9, phase: Math.random() * 6.28, alive: true };
      el.addEventListener('click', () => hit(b));
      return b;
    });
    S.wave = { target, bubbles, state: 'live', t: 0, H, speed: (H + 60) / S.dur };
  }
  function step(dt) {
    if (S.over) return false;
    const w = S.wave;
    if (!w || w.state !== 'live') return;
    w.t += dt;
    for (const b of w.bubbles) {
      if (!b.alive && !b.dud) continue;
      if (w.t < b.delay) continue;
      b.y += w.speed * dt;
      const x = Math.sin(w.t * 1.7 + b.phase) * 7;
      b.el.style.transform = `translate(${x.toFixed(1)}px, ${(-b.y).toFixed(1)}px)`;
      if (b.y > w.H) {
        b.alive = false; b.dud = false;
        if (b.c.id === w.target.id) { miss(); return; }
      }
    }
  }
  function hit(b) {
    const w = S.wave;
    if (!w || w.state !== 'live' || !b.alive || S.over) return;
    if (b.c.id === w.target.id) {
      b.alive = false;
      b.el.classList.add('pop');
      S.streak++;
      S.score += 10 + Math.min(S.streak - 1, 10) * 2;
      S.dur = Math.max(3.6, S.dur - 0.25);
      w.state = 'done';
      hud();
      later(nextWave, 450);
    } else {
      b.alive = false; b.dud = true;
      b.el.classList.add('dud');
      b.el.disabled = true;
      S.streak = 0;
      loseLife(w);
    }
  }
  function miss() {
    const w = S.wave;
    w.state = 'done';
    S.streak = 0;
    $('#b-reveal').textContent = 'Missed it. The answer was ' + w.target[gs.show];
    if (!loseLife(w)) later(nextWave, 1500);
  }
  function loseLife(w) {
    S.lives--;
    hud();
    if (S.lives > 0) return false;
    w.state = 'done';
    S.over = true;
    w.bubbles.forEach(b => { if (b.c.id === w.target.id) b.el.classList.add('reveal'); });
    if (!$('#b-reveal').textContent) $('#b-reveal').textContent = 'The answer was ' + w.target[gs.show];
    later(() => {
      const r = recordBest(set, 'bubble', 'score', S.score, false);
      root.innerHTML = resultBlock({ title: 'Out of lives', big: S.score + ' pts', isNew: r.isNew && r.hadPrev && S.score > 0, sub: r.isNew ? '' : `Your best is ${r.best} pts.` });
      bind('#again', play);
    }, 1600);
    return true;
  }
  keyHandler = e => {
    if (!S || S.over || !S.wave || isTyping(e.target)) return;
    const n = parseInt(e.key, 10);
    const b = S.wave.bubbles[n - 1];
    if (b && S.wave.t >= b.delay) { e.preventDefault(); hit(b); }
  };
  intro();
}

/* ---------- view: lightning round ---------- */
function viewLightning(set) {
  const cards = uniqueCards(studyCards(set));
  const ROUND = 60000;
  app.innerHTML = `<div class="wrap narrow page">${modeHeader(set, 'Lightning Round', `<span class="mult" id="lt-mult"></span>${stat('lt-score', 'score')}${stat('lt-time', 'seconds', '60')}`)}<div id="lt-root" class="stack"></div></div>`;
  const root = $('#lt-root');
  let S = null;
  function intro() {
    const b = bestOf(set, 'lightning', 'score');
    root.innerHTML = introBlock({
      title: 'Do these go together?',
      how: 'You get one minute. Each card shows a term and a definition, and you decide whether they belong together. Five right in a row bumps your multiplier, up to ×4. A wrong call resets it and takes 3 seconds off the clock.',
      extra: '<p class="muted small"><kbd>←</kbd> or <kbd>F</kbd> for no, <kbd>→</kbd> or <kbd>J</kbd> for yes</p>',
      best: b != null ? b + ' pts' : '',
      start: 'Start the clock',
    });
    bind('#again', play);
  }
  function play() {
    S = { score: 0, combo: 0, mult: 1, right: 0, total: 0, end: performance.now() + ROUND, q: null, last: null, over: false };
    root.innerHTML = `<div class="tbar" id="lt-bar"><span></span></div>
      <div class="lt-card card" id="lt-card"></div>
      <div class="lt-btns">
        <button class="btn big no" type="button" id="lt-no">No <kbd>←</kbd></button>
        <button class="btn big yes" type="button" id="lt-yes">Yes, they match <kbd>→</kbd></button>
      </div>`;
    bind('#lt-no', () => answer(false));
    bind('#lt-yes', () => answer(true));
    hud();
    nextQ();
    const bar = $('#lt-bar'), fill = bar.firstElementChild, tEl = $('#lt-time');
    loop(now => {
      if (S.over) return false;
      const rem = S.end - now;
      if (rem <= 0) { tEl.textContent = '0'; fill.style.width = '0%'; finish(); return false; }
      fill.style.width = (rem / ROUND * 100).toFixed(2) + '%';
      bar.classList.toggle('low', rem < 10000);
      tEl.textContent = Math.ceil(rem / 1000);
    });
  }
  function hud() {
    $('#lt-score').textContent = S.score;
    $('#lt-mult').textContent = S.mult > 1 ? '×' + S.mult : '';
  }
  function nextQ() {
    let c = cards[Math.floor(Math.random() * cards.length)];
    if (cards.length > 1) while (c.id === S.last) c = cards[Math.floor(Math.random() * cards.length)];
    S.last = c.id;
    let truth = Math.random() < 0.5, def = c.def;
    if (!truth) {
      const d = shuffle(cards).find(x => x.id !== c.id && key(x.def) !== key(c.def));
      if (d) def = d.def; else truth = true;
    }
    S.q = { c, def, truth };
    $('#lt-card').innerHTML = `<span class="side">Term</span><div class="lt-term">${esc(c.term)}</div><span class="side">Definition</span><div class="lt-def">${esc(def)}</div>`;
  }
  function answer(yes) {
    if (!S || S.over) return;
    S.total++;
    const ok = yes === S.q.truth;
    const card = $('#lt-card');
    card.classList.remove('flash-good', 'flash-bad'); void card.offsetWidth;
    if (ok) {
      S.right++; S.combo++;
      S.mult = 1 + Math.min(3, Math.floor(S.combo / 5));
      S.score += 10 * S.mult;
      card.classList.add('flash-good');
    } else {
      S.combo = 0; S.mult = 1;
      S.end -= 3000;
      card.classList.add('flash-bad');
    }
    hud();
    nextQ();
  }
  function finish() {
    S.over = true;
    root.querySelectorAll('.lt-btns button').forEach(b => { b.disabled = true; });
    const r = recordBest(set, 'lightning', 'score', S.score, false);
    later(() => {
      const acc = S.total ? Math.round(S.right / S.total * 100) : 0;
      root.innerHTML = resultBlock({ title: 'Time’s up', big: S.score + ' pts', isNew: r.isNew && r.hadPrev && S.score > 0, sub: `${S.right} of ${S.total} right, ${acc}% accuracy.${r.isNew ? '' : ` Your best is ${r.best} pts.`}` });
      bind('#again', play);
    }, 500);
  }
  keyHandler = e => {
    if (isTyping(e.target)) return;
    if (!S || S.over) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'f') { e.preventDefault(); answer(false); }
    else if (k === 'arrowright' || k === 'j') { e.preventDefault(); answer(true); }
  };
  intro();
}

/* ---------- view: unscramble ---------- */
function viewUnscramble(set) {
  const base = studyCards(set);
  const gs = gameSides(base);
  const eligible = scrambleEligible(base, gs);
  app.innerHTML = `<div class="wrap narrow page">${modeHeader(set, 'Unscramble', `${stat('us-n', 'word', '')}${stat('us-score', 'score')}`)}<div id="us-root" class="stack"></div></div>`;
  const root = $('#us-root');
  let S = null;
  function intro() {
    const b = bestOf(set, 'unscramble', 'score');
    const n = Math.min(10, eligible.length);
    root.innerHTML = introBlock({
      title: `${plural(n, 'word')} to put back together`,
      how: 'Read the clue, then click the letters in order or just type them. Each word is worth 10 points and every hint costs 3. Backspace takes back the last letter.',
      best: b != null ? b + ' pts' : '',
      start: 'Start',
    });
    bind('#again', play);
  }
  function play() {
    S = { pool: shuffle(eligible).slice(0, 10), i: 0, score: 0 };
    load();
  }
  function load() {
    const c = S.pool[S.i];
    const word = c[gs.show];
    const chars = [...word];
    const letters = chars.filter(ch => LETTER.test(ch));
    const target = letters.join('');
    let tiles = letters.slice();
    for (let tries = 0; tries < 12; tries++) {
      tiles = shuffle(letters);
      if (tiles.join('').toLowerCase() !== target.toLowerCase()) break;
    }
    Object.assign(S, { c, chars, letters, target, tiles, ans: [], hints: 0, locked: 0, state: 'play' });
    $('#us-n').textContent = `${S.i + 1}/${S.pool.length}`;
    $('#us-score').textContent = S.score;
    root.innerHTML = `<div class="us-clue card"><span class="side">${sideLabel(gs.clue)}</span><div class="qprompt ${gs.clue} ${sizeClass(c[gs.clue]) === 'sz-l' ? 'sz-m' : 'sz-s'}">${esc(c[gs.clue])}</div></div>
      <div class="slots" id="us-slots"></div>
      <div class="tiles" id="us-tiles"></div>
      <div class="row" style="justify-content:center">
        <button class="btn" type="button" id="us-back">Backspace</button>
        <button class="btn" type="button" id="us-hint">Hint (−3)</button>
        <button class="btn quiet" type="button" id="us-skip">Skip</button>
      </div>`;
    bind('#us-back', backspace);
    bind('#us-hint', hint);
    bind('#us-skip', skip);
    $('#us-tiles').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) place(+t.dataset.t); });
    $('#us-slots').addEventListener('click', e => {
      const s = e.target.closest('.slot[data-k]'); if (!s || S.state !== 'play') return;
      const k = +s.dataset.k;
      if (k < S.locked || k >= S.ans.length) return;
      S.ans.splice(k, 1);
      draw();
    });
    draw();
  }
  function draw(reveal) {
    let k = 0;
    const words = [];
    let cur = [];
    S.chars.forEach(ch => {
      if (/\s/.test(ch)) { if (cur.length) words.push(cur); cur = []; return; }
      if (LETTER.test(ch)) {
        const idx = k++;
        const filled = reveal ? S.letters[idx] : (S.ans[idx] != null ? S.tiles[S.ans[idx]] : '');
        const cls = idx < S.locked ? 'locked' : (filled ? 'filled' : '');
        cur.push(`<button class="slot ${cls}" type="button" data-k="${idx}" aria-label="Letter ${idx + 1}${filled ? ': ' + esc(filled) : ', empty'}">${esc(filled)}</button>`);
      } else {
        cur.push(`<span class="slot fixed">${esc(ch)}</span>`);
      }
    });
    if (cur.length) words.push(cur);
    const slots = $('#us-slots');
    slots.className = 'slots' + (S.state === 'solved' ? ' solved' : '') + (reveal ? ' revealed' : '');
    slots.innerHTML = words.map(w => `<span class="word">${w.join('')}</span>`).join('');
    const used = new Set(S.ans);
    $('#us-tiles').innerHTML = S.tiles.map((t, i) => `<button class="tile ${used.has(i) ? 'used' : ''}" type="button" data-t="${i}" ${used.has(i) || S.state !== 'play' ? 'disabled' : ''} aria-label="Letter ${esc(t)}">${esc(t)}</button>`).join('');
    const lockBtns = S.state !== 'play';
    ['#us-back', '#us-hint', '#us-skip'].forEach(sel => { const b = $(sel); if (b) b.disabled = lockBtns; });
  }
  function place(ti) {
    if (S.state !== 'play' || S.ans.includes(ti) || S.ans.length >= S.letters.length) return;
    S.ans.push(ti);
    draw();
    if (S.ans.length === S.letters.length) check();
  }
  function backspace() {
    if (S.state !== 'play' || S.ans.length <= S.locked) return;
    S.ans.pop();
    draw();
  }
  function check() {
    const built = S.ans.map(t => S.tiles[t]).join('');
    if (built.toLowerCase() === S.target.toLowerCase()) {
      S.state = 'solved';
      const pts = S.hints >= S.letters.length ? 0 : Math.max(1, 10 - 3 * S.hints);
      S.score += pts;
      $('#us-score').textContent = S.score;
      draw();
      later(advance, 900);
    } else {
      const slots = $('#us-slots');
      slots.classList.remove('bad'); void slots.offsetWidth; slots.classList.add('bad');
    }
  }
  function hint() {
    if (S.state !== 'play') return;
    S.hints++;
    S.locked = Math.min(S.letters.length, S.hints);
    const ans = [], used = new Set();
    for (let k = 0; k < S.locked; k++) {
      const want = S.letters[k].toLowerCase();
      const prefer = S.ans[k];
      const ti = (prefer != null && !used.has(prefer) && S.tiles[prefer].toLowerCase() === want) ? prefer : S.tiles.findIndex((t, i) => !used.has(i) && t.toLowerCase() === want);
      ans.push(ti); used.add(ti);
    }
    S.ans = ans;
    draw();
    if (S.ans.length === S.letters.length) check();
  }
  function skip() {
    if (S.state !== 'play') return;
    S.state = 'skipped';
    draw(true);
    later(advance, 1600);
  }
  function advance() {
    S.i++;
    if (S.i < S.pool.length) { load(); return; }
    const r = recordBest(set, 'unscramble', 'score', S.score, false);
    root.innerHTML = resultBlock({ title: 'That’s all of them', big: S.score + ' pts', isNew: r.isNew && r.hadPrev && S.score > 0, sub: `Out of ${S.pool.length * 10} possible.${r.isNew ? '' : ` Your best is ${r.best} pts.`}` });
    bind('#again', play);
  }
  keyHandler = e => {
    if (!S || !S.letters || S.state !== 'play' || isTyping(e.target)) return;
    if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
    if (e.key.length === 1 && LETTER.test(e.key)) {
      const used = new Set(S.ans);
      const ti = S.tiles.findIndex((t, i) => !used.has(i) && t.toLowerCase() === e.key.toLowerCase());
      if (ti >= 0) { e.preventDefault(); place(ti); }
    }
  };
  intro();
}

/* ---------- boot ---------- */
renderFoot();
render();
initStore().then(() => { renderFoot(); render(); }, () => { loadLocal(); renderFoot(); render(); });
})();
</script>
